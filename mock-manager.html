<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>document.documentElement.dataset.theme=localStorage.getItem("ssc-edge-theme")||"dark";</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#08050e;--c:#171025;--c2:#251344;--bd:#302044;--t:#fff;--m:#aaa2b9;--p:#7c3aed;--p2:#a66bff}:root[data-theme=light]{--b:#f6f3fb;--c:#fff;--c2:#f1eafa;--bd:#ddd1ef;--t:#211832;--m:#756985;--p:#6d35d4;--p2:#8149e8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Arial,sans-serif}header{position:sticky;top:0;background:var(--c);border-bottom:1px solid var(--bd);padding:12px 15px;display:flex;gap:10px;align-items:center;z-index:5}header a{color:var(--t);text-decoration:none}.brand{font-weight:800;font-size:17px}.brand span{color:var(--p2)}.sub{margin-left:auto;color:var(--m);font-size:12px}main{max-width:1100px;margin:auto;padding:14px}.panel{background:var(--c);border:1px solid var(--bd);border-radius:13px;padding:14px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--m);font-weight:bold}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--c2);color:var(--t)}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;font-size:12px;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:var(--c2);border:1px solid var(--bd);color:var(--t)}.danger{background:#ef444422;border:1px solid #ef444455;color:#f87171}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{display:grid;gap:8px}.row{padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--c2)}.rowhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.muted{color:var(--m);font-size:12px;line-height:1.5}.msg{margin:10px 0;padding:10px;border-radius:8px;background:var(--c2);color:var(--p2);white-space:pre-wrap}.question{padding:11px;margin:8px 0;border:1px solid var(--bd);border-radius:9px;background:var(--c2)}.qtitle{line-height:1.5;overflow-wrap:anywhere}.options{font-size:12px;color:var(--m);line-height:1.7;margin-top:7px}.hidden{display:none!important}@media(max-width:600px){main{padding:9px}.sub{display:none}}</style><title>Mock Manager · SSC EDGE</title></head><body><header><a href="questions.html">‹</a><div class="brand">SSC <span>EDGE</span></div><div class="sub">Mock Manager</div></header><main><section class="panel"><h2>Exam → Mocks → Edit</h2><p class="muted">Existing Practice Admin aur Admin Mock database structure ko use kiya gaya hai. Mock select karke assigned questions/sections edit karo.</p><div class="grid"><div class="field"><label>Exam</label><select id="exam" onchange="render()"><option value="">All Exams</option></select></div><div class="field"><label>Mock Type</label><select id="type" onchange="render()"><option value="">All Types</option><option value="FULL">Full Mock</option><option value="SECTIONAL">Sectional Mock</option></select></div></div><div id="msg" class="msg">Loading mocks…</div><div id="list" class="list"></div></section></main><script>const SUPABASE_URL="https://dvvyoygahzzbnpqrfhen.supabase.co";const SUPABASE_KEY="sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function msg(t){$('msg').textContent=t;}function nav(){return `<div class="actions"><a class="btn secondary" href="questions.html">Question Bank</a><a class="btn secondary" href="mock-manager.html">Mock Manager</a><a class="btn secondary" href="chapter-mock-manager.html">Chapter-wise Mocks</a><a class="btn secondary" href="question-shift-manager.html">Shift Manager</a></div>`}</script><script>let exams=[],mocks=[];async function init(){let [e,m]=await Promise.all([db.from('exams').select('*').order('name'),db.from('mock_tests').select('*').order('created_at',{ascending:false})]);if(e.error||m.error){msg((e.error||m.error).message);return}exams=e.data||[];mocks=m.data||[];$('exam').innerHTML='<option value="">All Exams</option>'+exams.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.title)}</option>`).join('');render()}function render(){let eid=$('exam').value,type=$('type').value,arr=mocks.filter(m=>(!eid||String(m.exam_id)===eid)&&(!type||String(m.test_type||'FULL').toUpperCase()===type));$('list').innerHTML=arr.map(m=>`<div class="row"><div class="rowhead"><div><b>${esc(m.title||m.name||'Untitled Mock')}</b><div class="muted">${esc(m.test_type||'FULL')} · ${esc(m.duration_minutes||0)} min · ${esc(m.total_questions||0)} questions</div></div><span class="muted">${m.is_active===false?'Inactive':'Active'}</span></div><div class="actions"><a class="btn primary" href="admin-mock.html?test_id=${encodeURIComponent(m.id)}">Edit Questions / Sections</a><a class="btn secondary" href="question-manager.html?exam_id=${encodeURIComponent(m.exam_id||'')}&test_id=${encodeURIComponent(m.id)}">Question Manager</a><a class="btn secondary" href="admin-practice.html">Edit Mock Setup</a></div></div>`).join('')||'<div class="muted">No mocks found.</div>';msg(arr.length+' mocks found.')}init();</script></body></html>
