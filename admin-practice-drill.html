<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<title>SSC EDGE - Practice Drill Admin</title>

<link rel="stylesheet" href="css/style.css">

<style>
:root{
  --a-bg:#080811;
  --a-card:#11111d;
  --a-card2:#171727;
  --a-border:#292943;
  --a-text:#f5f5ff;
  --a-muted:#9b9bb5;
  --a-p:#8b5cf6;
  --a-p2:#a78bfa;
  --a-red:#ef4444;
}

:root[data-theme=light]{
  --a-bg:#f5f6fb;
  --a-card:#fff;
  --a-card2:#f0f0f8;
  --a-border:#dcdceb;
  --a-text:#171725;
  --a-muted:#68687d;
  --a-p:#6d3ee8;
  --a-p2:#7c4dff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--a-bg);
  color:var(--a-text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.head{
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 15px;
  background:var(--a-card);
  border-bottom:1px solid var(--a-border);
  position:sticky;
  top:0;
  z-index:5;
}

.back{
  width:36px;
  height:36px;
  border:1px solid var(--a-border);
  border-radius:10px;
  background:var(--a-card2);
  color:var(--a-text);
  font-size:20px;
}

.brand{
  font-weight:800;
}

.brand span{
  color:var(--a-p2);
}

.sub{
  margin-left:auto;
  color:var(--a-muted);
  font-size:11px;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.panel{
  background:var(--a-card);
  border:1px solid var(--a-border);
  border-radius:15px;
  padding:14px;
  margin-bottom:14px;
}

.headrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.headrow h2{
  font-size:16px;
  margin:0;
}

.muted{
  color:var(--a-muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:9px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800;
}

.primary{
  background:var(--a-p);
  color:#fff;
}

.secondary{
  background:var(--a-card2);
  color:var(--a-text);
  border:1px solid var(--a-border);
}

.danger{
  background:rgba(239,68,68,.15);
  color:#f87171;
  border:1px solid rgba(239,68,68,.3);
}

.exam,
.item,
.folder{
  border:1px solid var(--a-border);
  background:var(--a-card2);
  color:var(--a-text);
  border-radius:11px;
  padding:11px;
  text-align:left;
}

.exam.active,
.folder.active{
  border-color:var(--a-p);
  box-shadow:0 0 0 1px var(--a-p);
}

.exam small,
.item small,
.folder small{
  display:block;
  color:var(--a-muted);
  font-size:10px;
  margin-top:4px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.list{
  display:grid;
  gap:8px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:11px;
  color:var(--a-muted);
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid var(--a-border);
  background:var(--a-card2);
  color:var(--a-text);
  border-radius:9px;
  outline:none;
}

.field textarea{
  min-height:70px;
}

.check{
  display:flex;
  gap:7px;
  align-items:center;
  font-size:12px;
  color:var(--a-muted);
}

.empty{
  text-align:center;
  color:var(--a-muted);
  padding:22px 8px;
  font-size:13px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  z-index:50;
}

.modal.show{
  display:flex;
}

.box{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--a-card);
  border:1px solid var(--a-border);
  border-radius:15px;
  padding:15px;
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#222232;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  display:none;
  z-index:100;
  font-size:12px;
}

.toast.show{
  display:block;
}

/* Folder first-letter icon */
.folder-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:rgba(139,92,246,.16);
  color:var(--a-p2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:900;
  flex:none;
}

/* Breadcrumb */
.breadcrumb{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  color:var(--a-muted);
  font-size:11px;
  margin-bottom:10px;
}

.breadcrumb span{
  color:var(--a-text);
  font-weight:700;
}

@media(max-width:600px){
  .form{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .sub{
    display:none;
  }

  .row{
    align-items:flex-start;
  }

  .actions .btn{
    padding:8px 9px;
    font-size:11px;
  }
}
</style>
<script src="admin-nav.js"></script>
</head>

<body>

<header class="head">
  <button class="back" onclick="location.href='admin.html'">‹</button>

  <div class="brand">
    SSC <span>EDGE</span>
  </div>

  <div class="sub">
    Practice Drill Manager
  </div>
</header>

<main class="wrap">

  <!-- EXAMS -->
  <section class="panel">
    <div class="headrow">
      <h2>Select Exam</h2>
      <span class="muted" id="authStatus">
        Checking admin...
      </span>
    </div>

    <div class="grid" id="examGrid">
      <div class="empty">Loading...</div>
    </div>
  </section>

  <!-- SUBJECTS -->
  <section
    class="panel"
    id="subjectPanel"
    style="display:none"
  >
    <div class="headrow">
      <h2>Select Subject</h2>

      <button
        class="btn secondary"
        onclick="openSubjectModal()"
      >
        ＋ Subject
      </button>
    </div>

    <div class="grid" id="subjectGrid"></div>
  </section>

  <!-- ROOT FOLDERS -->
  <section
    class="panel"
    id="folderPanel"
    style="display:none"
  >
    <div class="headrow">
      <div>
        <h2>Practice Folders</h2>
        <div class="muted">
          Add, edit, delete and reorder folders.
        </div>
      </div>

      <div class="actions">
        <button class="btn secondary" id="organizeBtn" style="display:none" onclick="openOrganizeModal()">⚙ Auto-Organize</button>
        <button class="btn primary" onclick="openFolderModal()">＋ Folder</button>
      </div>
    </div>

    <div class="list" id="folderList"></div>
  </section>

  <!-- CURRENT FOLDER CONTENT -->
  <section
    class="panel"
    id="contentPanel"
    style="display:none"
  >

    <div id="folderBreadcrumb"></div>

    <div class="headrow">
      <div>
        <h2 id="contentTitle">Folder</h2>

        <div class="muted">
          Manage child folders and tests.
        </div>
      </div>

      <div class="actions">

        <button
          class="btn secondary"
          id="parentBtn"
          onclick="goToParent()"
          style="display:none"
        >
          ← Parent
        </button>

        <button
          class="btn secondary"
          onclick="openChildFolderModal()"
        >
          ＋ Child Folder
        </button>

        <button
          class="btn primary"
          onclick="openTestModal()"
        >
          ＋ Test
        </button>

      </div>
    </div>

    <div class="list" id="childList"></div>

    <div style="height:12px"></div>

    <div class="list" id="testList"></div>

  </section>

</main>

<!-- MODAL -->
<div class="modal" id="modal">

  <div class="box">

    <div class="headrow">
      <h2 id="modalTitle">Edit</h2>

      <button
        class="btn secondary"
        onclick="closeModal()"
      >
        ×
      </button>
    </div>

    <div id="modalBody"></div>

    <div
      class="actions"
      style="margin-top:14px"
    >
      <button
        class="btn secondary"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="btn primary"
        id="saveBtn"
      >
        Save
      </button>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let exams = [];
let subjects = [];
let folders = [];
let tests = [];

let selectedExam = null;
let selectedSubject = null;
let selectedFolder = null;

let editing = null;
let mode = "";

const $ = id =>
  document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function firstLetter(v){
  return String(v || "F")
    .trim()
    .charAt(0)
    .toUpperCase();
}

function toast(x){
  $("toast").textContent = x;
  $("toast").classList.add("show");

  setTimeout(() => {
    $("toast").classList.remove("show");
  },2600);
}

/* ADMIN CHECK */

async function checkAdmin(){

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){
    location.href = "admin.html";
    return false;
  }

  const r =
    await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id",user.id)
      .maybeSingle();

  if(r.error || !r.data){

    await db.auth.signOut();

    location.href = "admin.html";

    return false;
  }

  $("authStatus").textContent =
    "Admin verified";

  return true;
}

/* LOAD DATA */

async function load(){

  if(!(await checkAdmin())) return;

  const [
    e,
    s,
    f,
    t
  ] = await Promise.all([

    db
      .from("exams")
      .select("*")
      .order("name"),

    db
      .from("subjects")
      .select("*")
      .order("name"),

    db
      .from("mock_folders")
      .select("*")
      .order("sort_order")
      .order("name"),

    db
      .from("mock_tests")
      .select("*")
      .order("sort_order")
      .order("created_at",{
        ascending:false
      })

  ]);

  const er =
    e.error ||
    s.error ||
    f.error ||
    t.error;

  if(er) throw er;

  exams = e.data || [];
  subjects = s.data || [];
  folders = f.data || [];
  tests = t.data || [];

  renderExams();
}

/* EXAMS */

function renderExams(){

  $("examGrid").innerHTML =

    exams.map(e => `

      <button
        class="exam ${
          selectedExam &&
          selectedExam.id === e.id
            ? "active"
            : ""
        }"
        onclick="selectExam('${e.id}')"
      >

        ${esc(e.name || e.title)}

        <small>
          ${esc(e.board || "Exam")}
        </small>

      </button>

    `).join("")

    ||

    `<div class="empty">
      No exams found.
    </div>`;
}

function selectExam(id){

  selectedExam =
    exams.find(
      e => String(e.id) === String(id)
    );

  selectedSubject = null;
  selectedFolder = null;

  $("subjectPanel").style.display = "block";
  $("folderPanel").style.display = "none";
  $("contentPanel").style.display = "none";

  renderExams();
  renderSubjects();
}

/* SUBJECTS */

function renderSubjects(){

  $("subjectGrid").innerHTML =

    subjects.map(s => `

      <button
        class="exam ${
          selectedSubject &&
          selectedSubject.id === s.id
            ? "active"
            : ""
        }"
        onclick="selectSubject('${s.id}')"
      >

        ${esc(s.name)}

        <small>
          Manage drill folders
        </small>

      </button>

    `).join("")

    ||

    `<div class="empty">
      No subjects found.
    </div>`;
}

function selectSubject(id){

  selectedSubject =
    subjects.find(
      s => String(s.id) === String(id)
    );

  selectedFolder = null;

  $("folderPanel").style.display = "block";
  $("contentPanel").style.display = "none";

  renderSubjects();
  renderFolders();
}

/* ROOT FOLDERS */

function subjectFolders(){

  return folders.filter(f =>

    String(f.exam_id) ===
      String(selectedExam.id)

    &&

    String(f.subject_id || "") ===
      String(selectedSubject.id)

    &&

    !f.parent_id

  );
}

function renderFolders(){
  const ob = $("organizeBtn");
  if(ob) ob.style.display = (selectedSubject && drillGroupCfg(selectedSubject.name)) ? "inline-block" : "none";
  const fs = subjectFolders();

  $("folderList").innerHTML =

    fs.map(f => `

      <div
        class="folder ${
          selectedFolder &&
          selectedFolder.id === f.id
            ? "active"
            : ""
        }"
      >

        <div class="row">

          <div
            onclick="selectFolder('${f.id}')"
            style="
              flex:1;
              display:flex;
              align-items:center;
              gap:10px;
              cursor:pointer
            "
          >

            <div class="folder-icon">
              ${iconOf(f)}
            </div>

            <div>

              <b>
                ${esc(
                  f.display_name || f.name
                )}
              </b>

              <small>
                ${esc(
                  f.folder_type || "DRILL"
                )}
                ·
                ${
                  f.is_active === false
                    ? "Inactive"
                    : "Active"
                }
              </small>

            </div>

          </div>

          <div class="actions">

            <button
              class="btn secondary"
              onclick="moveFolder('${f.id}',-1)"
            >
              ↑
            </button>

            <button
              class="btn secondary"
              onclick="moveFolder('${f.id}',1)"
            >
              ↓
            </button>

            <button
              class="btn secondary"
              onclick="editFolder('${f.id}')"
            >
              Edit
            </button>

            <button
              class="btn danger"
              onclick="deleteFolder('${f.id}')"
            >
              Delete
            </button>

          </div>

        </div>

      </div>

    `).join("")

    ||

    `<div class="empty">
      No folders created for this subject.
    </div>`;
}

/* SELECT ANY FOLDER INCLUDING CHILD FOLDER */

function selectFolder(id){

  selectedFolder =
    folders.find(
      f => String(f.id) === String(id)
    );

  if(!selectedFolder) return;

  $("contentPanel").style.display = "block";

  $("contentTitle").textContent =
    selectedFolder.display_name ||
    selectedFolder.name;

  renderFolders();
  renderContents();
}

/* CURRENT FOLDER CHILDREN */

function children(){

  if(!selectedFolder) return [];

  return folders
    .filter(f =>
      String(f.parent_id || "") ===
      String(selectedFolder.id)
    )
    .sort(
      (a,b) =>
        (a.sort_order || 0) -
        (b.sort_order || 0)
    );
}

/* BREADCRUMB */

function renderBreadcrumb(){

  if(!selectedFolder){
    $("folderBreadcrumb").innerHTML = "";
    return;
  }

  const path = [];

  let current = selectedFolder;

  while(current){

    path.unshift(current);

    current =
      folders.find(
        f =>
          String(f.id) ===
          String(current.parent_id || "")
      );
  }

  $("folderBreadcrumb").innerHTML = `

    <div class="breadcrumb">

      <span>Practice Drill</span>

      <b>›</b>

      <span>
        ${esc(selectedExam?.name || "")}
      </span>

      <b>›</b>

      <span>
        ${esc(selectedSubject?.name || "")}
      </span>

      ${path.map((p,i) => `

        <b>›</b>

        <span
          style="cursor:pointer"
          onclick="selectFolder('${p.id}')"
        >
          ${esc(
            p.display_name || p.name
          )}
        </span>

      `).join("")}

    </div>

  `;
}

/* PARENT FOLDER */

function goToParent(){

  if(!selectedFolder) return;

  if(selectedFolder.parent_id){

    selectFolder(
      selectedFolder.parent_id
    );

  }else{

    selectedFolder = null;

    $("contentPanel").style.display = "none";

    renderFolders();

  }
}

/* RENDER CHILD FOLDERS + TESTS */

function renderContents(){

  if(!selectedFolder) return;

  const cs = children();

  const ts = tests.filter(t =>
    String(t.folder_id || "") ===
    String(selectedFolder.id)
  );

  renderBreadcrumb();

  $("contentTitle").textContent =
    selectedFolder.display_name ||
    selectedFolder.name;

  $("parentBtn").style.display =
    selectedFolder.parent_id
      ? "inline-block"
      : "none";

  $("childList").innerHTML =

    cs.map(c => `

      <div class="item">

        <div class="row">

          <div
            onclick="selectFolder('${c.id}')"
            style="
              flex:1;
              display:flex;
              align-items:center;
              gap:10px;
              cursor:pointer
            "
          >

            <div class="folder-icon">
              ${iconOf(c)}
            </div>

            <div>

              <b>
                ${esc(
                  c.display_name || c.name
                )}
              </b>

              <small>
                Child Folder ·
                ${
                  c.is_active === false
                    ? "Inactive"
                    : "Active"
                }
              </small>

            </div>

          </div>

          <div class="actions">

            <button
              class="btn secondary"
              onclick="selectFolder('${c.id}')"
            >
              Open
            </button>

            <button class="btn secondary" onclick="moveChild('${c.id}',-1)">↑</button>
            <button class="btn secondary" onclick="moveChild('${c.id}',1)">↓</button>
            <button class="btn secondary" onclick="openMoveFolder('${c.id}')">Move</button>
            <button
              class="btn secondary"
              onclick="editChild('${c.id}')"
            >
              Edit
            </button>

            <button
              class="btn danger"
              onclick="deleteFolder('${c.id}')"
            >
              Delete
            </button>

          </div>

        </div>

      </div>

    `).join("")

    ||

    `<div class="empty">
      No child folders in this folder.
    </div>`;

  $("testList").innerHTML =

    ts.map(t => `

      <div class="item">

        <div class="row">

          <div>

            <b>
              ${esc(t.title)}
            </b>

            <small>
              ${t.duration_minutes || 0} min
              ·
              ${t.total_questions || 0} questions
              ·
              ${
                t.is_active === false
                  ? "Inactive"
                  : "Active"
              }
            </small>

          </div>

          <div class="actions">

            <button class="btn secondary" onclick="openMoveTest('${t.id}')">Move</button>
            <button
              class="btn secondary"
              onclick="editTest('${t.id}')"
            >
              Edit
            </button>

            <button
              class="btn secondary"
              onclick="location.href='admin-mock.html?test_id=${t.id}'"
            >
              Questions
            </button>

            <button
              class="btn danger"
              onclick="deleteTest('${t.id}')"
            >
              Delete
            </button>

          </div>

        </div>

      </div>

    `).join("")

    ||

    `<div class="empty">
      No tests in this folder.
    </div>`;
}

/* ADD ROOT FOLDER */

function openFolderModal(){

  editing = null;
  mode = "folder";

  showModal(
    "Add Folder",

    `
    <div class="form">

      <div class="field">
        <label>Folder Name *</label>
        <input id="fName">
      </div>

      <div class="field">
        <label>Folder Type</label>

        <select id="fType">
          <option value="DRILL">
            Practice Folder
          </option>

          <option value="CHAPTER_WISE">
            Chapter Wise Practice
          </option>

          <option value="QUIZZES">
            Quizzes
          </option>

          <option value="REVISION_BOOSTER">
            Revision Booster
          </option>
        </select>
      </div>

      <div class="field">
        <label>Display Name</label>
        <input id="fDisplay">
      </div>

      <div class="field">
        <label>Active</label>

        <select id="fActive">
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>

    </div>
    `,

    saveFolder
  );
}

/* ADD CHILD FOLDER AT ANY LEVEL */

function openChildFolderModal(){

  if(!selectedFolder){
    return toast("Select a parent folder");
  }

  editing = null;
  mode = "child";

  showModal(
    "Add Child Folder",

    `
    <div class="form">

      <div class="field full">
        <label>
          Parent Folder
        </label>

        <input
          value="${esc(
            selectedFolder.display_name ||
            selectedFolder.name
          )}"
          disabled
        >
      </div>

/* REORDER (siblings are re-numbered 1..n so equal sort_order values never block a move) */
async function reorderSiblings(list,id,dir){
  const i = list.findIndex(x => String(x.id) === String(id));
  const j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  const arr = [...list];
  [arr[i],arr[j]] = [arr[j],arr[i]];
  const jobs = arr.map((f,k) => (Number(f.sort_order) === k + 1)
    ? null
    : db.from("mock_folders").update({sort_order:k + 1}).eq("id",f.id)).filter(Boolean);
  const res = await Promise.all(jobs);
  const bad = res.find(r => r.error);
  if(bad) return toast(bad.error.message);
  await reload();
}
function moveFolder(id,dir){ return reorderSiblings(subjectFolders(),id,dir); }
function moveChild(id,dir){ return reorderSiblings(children(),id,dir); }

/* ===== Practice Drill groups (same block is used in all Practice Drill pages) ===== */
const DRILL_GROUP_SETS=[
  {subject:/english/i,groups:["Grammar","Vocabulary","Reading Comprehension"],fallback:"Grammar",rules:[
    ["Reading Comprehension",/comprehension|cloze|passage|para ?jumble|sentence rearrange|pqrs/],
    ["Vocabulary",/antonym|synonym|homonym|idiom|phrase|phrasal|one word|spelling|vocab|word/]]},
  {subject:/math|quant/i,groups:["Arithmetic Maths","Advance Maths","Number System"],fallback:"Arithmetic Maths",rules:[
    ["Number System",/number system|hcf|lcm|divisib|remainder|unit digit|surd|indices|square root|cube root|simplification|bodmas|decimal|fraction|prime|factor|number theory|approximation|digit/],
    ["Advance Maths",/algebra|geometr|trigonometr|mensuration|coordinate|height|quadratic|polynomial|triangle|circle|quadrilateral|statistic|probability|permutation|combination|inequalit|progression|logarithm|linear equation|identit|maxima|minima|\b[23]d\b/]]},
  {subject:/reasoning/i,groups:["Verbal Reasoning","Non Verbal Reasoning","Statement Based Questions"],fallback:"Verbal Reasoning",rules:[
    ["Statement Based Questions",/syllogism|statement|assumption|argument|conclusion|course of action|inference|assertion|cause and effect|decision making/],
    ["Non Verbal Reasoning",/non ?verbal|figure|image|mirror|water|paper fold|paper cut|embedded|hidden|dice|cube|pattern|visual|shape|dot situation|rotation/]]}
];
const gnorm=s=>String(s||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
function drillGroupCfg(subjectName){return DRILL_GROUP_SETS.find(c=>c.subject.test(String(subjectName||"")))||null}
function drillGroupFor(subjectName,chapterName){
  const cfg=drillGroupCfg(subjectName);if(!cfg)return null;
  const n=gnorm(chapterName);
  for(const [g,re] of cfg.rules)if(re.test(n))return g;
  return cfg.fallback;
}

/* ===== MOVE a chapter/child folder (with all its mocks) or a single mock =====
   Only parent_id / folder_id changes. Mocks, questions and attempts are never touched. */
let moving = null;
const nameOf = f => f.display_name || f.name;
function scopeFolders(){
  return folders.filter(f =>
    String(f.exam_id) === String(selectedExam.id) &&
    String(f.subject_id || "") === String(selectedSubject.id));
}
function pathLabel(f){
  const parts = [];
  let cur = f, guard = 0;
  while(cur && guard++ < 20){
    parts.unshift(nameOf(cur));
    cur = folders.find(x => String(x.id) === String(cur.parent_id || ""));
  }
  return parts.join(" › ");
}
function descendantIds(id){
  const out = new Set([String(id)]);
  let grew = true;
  while(grew){
    grew = false;
    folders.forEach(f => {
      if(f.parent_id && out.has(String(f.parent_id)) && !out.has(String(f.id))){
        out.add(String(f.id));
        grew = true;
      }
    });
  }
  return out;
}
function openMoveFolder(id){
  const f = folders.find(x => String(x.id) === String(id));
  if(!f) return;
  moving = {kind:"folder", id:f.id};
  const banned = descendantIds(f.id);
  const opts = scopeFolders()
    .filter(x => !banned.has(String(x.id)))
    .sort((a,b) => pathLabel(a).localeCompare(pathLabel(b)))
    .map(x => `<option value="${esc(x.id)}" ${String(x.id) === String(f.parent_id || "") ? "selected" : ""}>${esc(pathLabel(x))}</option>`)
    .join("");
  showModal("Move Folder", `
    <div class="form">
      <div class="field full"><label>Folder</label><input value="${esc(nameOf(f))}" disabled></div>
      <div class="field full">
        <label>Move into</label>
        <select id="mvTarget">
          <option value="">— Top level of ${esc(selectedSubject.name)} —</option>
          ${opts}
        </select>
      </div>
      <div class="field full muted">All mocks and child folders inside this folder move with it. Nothing is deleted or re-created.</div>
    </div>`, saveMove);
}
function openMoveTest(id){
  const t = tests.find(x => String(x.id) === String(id));
  if(!t) return;
  moving = {kind:"test", id:t.id};
  const opts = scopeFolders()
    .sort((a,b) => pathLabel(a).localeCompare(pathLabel(b)))
    .map(x => `<option value="${esc(x.id)}" ${String(x.id) === String(t.folder_id || "") ? "selected" : ""}>${esc(pathLabel(x))}</option>`)
    .join("");
  showModal("Move Mock", `
    <div class="form">
      <div class="field full"><label>Mock</label><input value="${esc(t.title)}" disabled></div>
      <div class="field full"><label>Move into folder</label><select id="mvTarget">${opts}</select></div>
      <div class="field full muted">Only the folder changes. Questions and student attempts stay as they are.</div>
    </div>`, saveMove);
}
async function saveMove(){
  if(!moving) return;
  const target = $("mvTarget").value || null;
  let r;
  if(moving.kind === "folder"){
    if(target && descendantIds(moving.id).has(String(target))) return toast("Cannot move a folder into itself");
    const sibs = folders.filter(x => String(x.parent_id || "") === String(target || "") &&
      String(x.subject_id || "") === String(selectedSubject.id) &&
      String(x.exam_id) === String(selectedExam.id)).length;
    r = await db.from("mock_folders").update({parent_id:target,sort_order:sibs + 1}).eq("id",moving.id);
  }else{
    if(!target) return toast("Select a folder");
    r = await db.from("mock_tests").update({folder_id:target}).eq("id",moving.id);
  }
  if(r.error) return toast(r.error.message);
  const kind = moving.kind;
  closeModal();
  moving = null;
  await reload();
  toast(kind === "folder" ? "Folder moved" : "Mock moved");
}

/* ===== AUTO-ORGANIZE: put chapter folders into their group folders (Maths / English / Reasoning) =====
   Chapter folders (with their mocks) are only re-parented, so no mock breaks. Every chapter can be
   changed in the preview before applying, and any folder can be moved later with the Move button. */
function organizePlan(){
  const cfg = drillGroupCfg(selectedSubject.name);
  if(!cfg) return null;
  const scope = scopeFolders();
  const isCh = f => String(f.folder_type || "").toUpperCase().includes("CHAPTER");
  const groupKeys = new Set(cfg.groups.map(gnorm));
  const oldRoots = scope.filter(f => !f.parent_id && isCh(f) && !groupKeys.has(gnorm(nameOf(f))));
  const rootIds = new Set(oldRoots.map(f => String(f.id)));
  const items = scope
    .filter(f => f.parent_id && rootIds.has(String(f.parent_id)))
    .map(f => ({f, target:drillGroupFor(selectedSubject.name,nameOf(f))}))
    .sort((a,b) => cfg.groups.indexOf(a.target) - cfg.groups.indexOf(b.target) || nameOf(a.f).localeCompare(nameOf(b.f)));
  return {cfg, scope, oldRoots, items};
}
function openOrganizeModal(){
  const plan = organizePlan();
  if(!plan) return toast("Groups are defined for English, Maths and Reasoning only");
  if(!plan.items.length) return toast("Nothing to organize — chapters are already inside group folders");
  mode = "organize";
  showModal("Auto-Organize " + selectedSubject.name, `
    <div class="muted" style="margin-bottom:10px">
      ${plan.items.length} chapter folder(s) will move into: <b>${esc(plan.cfg.groups.join(", "))}</b>.
      Each folder gets only its own chapters' mocks (they are divided, not copied):
      ${plan.cfg.groups.map(g => {
        const its = plan.items.filter(x => x.target === g);
        const m = its.reduce((a,x) => a + tests.filter(t => String(t.folder_id || "") === String(x.f.id)).length, 0);
        return `<br>• <b>${esc(g)}</b>: ${its.length} chapters, ${m} mocks`;
      }).join("")}
      <br>Change any chapter below if it was placed wrongly.
    </div>
    <div class="list">
      ${plan.items.map(x => `
        <div class="item"><div class="row">
          <div style="flex:1"><b>${esc(nameOf(x.f))}</b><small>${tests.filter(t => String(t.folder_id || "") === String(x.f.id)).length} mocks</small></div>
          <select data-org="${esc(x.f.id)}" style="padding:8px;border-radius:8px;border:1px solid var(--a-border);background:var(--a-card2);color:var(--a-text)">
            ${plan.cfg.groups.map(g => `<option ${g === x.target ? "selected" : ""}>${esc(g)}</option>`).join("")}
          </select>
        </div></div>`).join("")}
    </div>`, applyOrganize);
}
async function applyOrganize(){
  const plan = organizePlan();
  if(!plan) return;
  const chosen = new Map();
  document.querySelectorAll("#modalBody select[data-org]").forEach(el => chosen.set(String(el.dataset.org), el.value));
  const btn = $("saveBtn");
  btn.disabled = true;
  try{
    const isCh = f => String(f.folder_type || "").toUpperCase().includes("CHAPTER");
    const needed = [...new Set(plan.items.map(x => chosen.get(String(x.f.id)) || x.target))];
    const groupId = {};
    for(const g of plan.cfg.groups){
      if(!needed.includes(g)) continue;
      let root = plan.scope.find(f => !f.parent_id && isCh(f) && gnorm(nameOf(f)) === gnorm(g));
      if(!root){
        const r = await db.from("mock_folders").insert({
          exam_id:selectedExam.id, subject_id:selectedSubject.id, name:g, display_name:g,
          folder_type:"CHAPTER", parent_id:null, is_active:true,
          sort_order:plan.cfg.groups.indexOf(g) + 1
        }).select("id").single();
        if(r.error) throw r.error;
        root = r.data;
      }else if(root.is_active === false){
        const r = await db.from("mock_folders").update({is_active:true}).eq("id",root.id);
        if(r.error) throw r.error;
      }
      groupId[g] = root.id;
    }
    for(const g of needed){
      const ids = plan.items.filter(x => (chosen.get(String(x.f.id)) || x.target) === g).map(x => x.f.id);
      if(!ids.length) continue;
      const r = await db.from("mock_folders").update({parent_id:groupId[g]}).in("id",ids);
      if(r.error) throw r.error;
    }
    // same rename the student page used to do virtually
    for(const x of plan.items){
      if(gnorm(x.f.name).includes("mc sentence rearrange") && !x.f.display_name){
        await db.from("mock_folders").update({display_name:"Para Jumble [PQRS]"}).eq("id",x.f.id);
      }
    }
    // remove the old "Chapter Wise" root only if it is now completely empty
    for(const root of plan.oldRoots){
      const hasTests = tests.some(t => String(t.folder_id || "") === String(root.id));
      const hasOtherKids = folders.some(f => String(f.parent_id || "") === String(root.id) &&
        !plan.items.some(x => String(x.f.id) === String(f.id)));
      if(!hasTests && !hasOtherKids){
        await db.from("mock_folders").delete().eq("id",root.id);
      }
    }
    closeModal();
    selectedFolder = null;
    $("contentPanel").style.display = "none";
    await reload();
    toast("Organized into group folders");
  }catch(e){
    toast(e.message || "Could not organize");
  }finally{
    btn.disabled = false;
  }
}

            ${
              t.is_active === false
                ? "selected"
                : ""
            }
          >
            Inactive
          </option>

        </select>
      </div>

    </div>

  `;
}

/* SAVE TEST IN CURRENT SELECTED FOLDER */

async function saveTest(){

  const title =
    $("tTitle").value.trim();

  if(!title){
    return toast("Title required");
  }

  if(!selectedFolder){
    return toast("Select folder first");
  }

  const payload = {

    exam_id:selectedExam.id,

    folder_id:selectedFolder.id,

    subject_id:selectedSubject.id,

    title:title,

    description:
      $("tDesc").value.trim() || null,

    test_type:"FULL",

    duration_minutes:
      Number($("tDuration").value) || 15,

    total_questions:
      Number($("tTotal").value) || 0,

    marks_per_question:
      Number($("tMarks").value) || 1,

    negative_marks_per_question:
      Number($("tNeg").value) || 0,

    is_active:
      $("tActive").value === "true",

    sort_order:
      editing?.sort_order ?? 0

  };

  let r;

  if(editing){

    r =
      await db
        .from("mock_tests")
        .update(payload)
        .eq("id",editing.id)
        .select()
        .single();

  }else{

    r =
      await db
        .from("mock_tests")
        .insert(payload)
        .select()
        .single();
  }

  if(r.error){
    return toast(r.error.message);
  }

  const savedTest = r.data;

  /* Create section only for new test */

  if(savedTest && !editing){

    const existingSection =
      await db
        .from("mock_test_sections")
        .select("id")
        .eq("mock_test_id",savedTest.id)
        .limit(1);

    if(
      !existingSection.error &&
      (
        !existingSection.data ||
        !existingSection.data.length
      )
    ){

      await db
        .from("mock_test_sections")
        .insert({

          mock_test_id:savedTest.id,

          subject_id:selectedSubject.id,

          section_name:selectedSubject.name,

          duration_minutes:
            Number(
              $("tDuration").value
            ) || 15,

          section_order:1

        });
    }
  }

  closeModal();

  await reload();

  toast(
    editing
      ? "Test updated"
      : "Test saved. Use Questions button to assign questions."
  );
}

/* DELETE TEST */

async function deleteTest(id){

  if(!confirm("Delete this test?")){
    return;
  }

  const r =
    await db
      .from("mock_tests")
      .delete()
      .eq("id",id);

  if(r.error){
    return toast(r.error.message);
  }

  await reload();

  toast("Test deleted");
}
