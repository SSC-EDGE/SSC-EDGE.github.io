<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English - SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "light";
</script>

<link rel="stylesheet" href="css/style.css">

<script src="js/downloads.js"></script>

<style>

.container{
padding:20px;
padding-bottom:90px;
}

.page-title{
font-size:26px;
font-weight:bold;
margin-bottom:6px;
}

.page-subtitle{
color:var(--muted);
margin-bottom:20px;
}

.pdf-list{
display:flex;
flex-direction:column;
gap:18px;
}

.pdf-card{
background:var(--card);
border:1px solid var(--border);
border-radius:17px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.pdf-content{
padding:16px;
}

.pdf-title{
font-size:18px;
font-weight:bold;
line-height:1.4;
margin-bottom:7px;
}

.pdf-subject{
font-size:13px;
color:var(--muted);
margin-bottom:9px;
}

.pdf-description{
color:var(--muted);
font-size:14px;
line-height:1.5;
margin-bottom:14px;
}

.pdf-actions{
display:flex;
gap:10px;
}

.open,
.download{
flex:1;
display:flex;
align-items:center;
justify-content:center;
min-height:46px;
padding:11px 10px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
box-sizing:border-box;
}

.open{
background:var(--purple);
color:white;
}

.download{
background:var(--card2);
color:var(--text);
border:1px solid var(--border);
}

.empty{
text-align:center;
color:var(--muted);
padding:30px 10px;
}


.ssc-back{display:inline-block; margin-bottom:14px; font-size:14px; font-weight:800; color:var(--purple,#8b45ee); text-decoration:none;}
header.ssc-head:where(:not(.keep)), .header-tagline, .home-footer{display:none;}

/* ==================================================
   DESKTOP LAYOUT (960px and wider only)
   ================================================== */
@media(min-width:960px){
body{display:flex; flex-direction:column; min-height:100vh; margin:0; padding:0;}
body header.ssc-head{
  position:sticky; top:0; z-index:98; width:100%; max-width:none; height:96px; margin:0; padding:0 max(32px, calc((100% - max(1200px, 83.333%)) / 2));
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  box-sizing:border-box; background:var(--header); border:0; border-bottom:1px solid var(--border);
}
body .ssc-head .brand{display:block; margin:0; padding:0;}
body .ssc-head .brand strong{display:block; font-size:44px; line-height:1; font-weight:900; color:var(--text);}
body .ssc-head .brand span{color:#9b5cff;}
body .ssc-head .header-tagline{display:block; margin-top:6px; font-size:17px; font-weight:700; line-height:1; color:var(--muted);}
body .container{flex:1 0 auto; box-sizing:border-box; width:100%; max-width:max(1264px, calc(83.333% + 64px)); margin:0 auto; padding:32px 32px 56px;}
.ssc-back{align-self:flex-start; font-size:15px; margin-bottom:20px;}
.page-title{font-size:38px; margin-bottom:8px;}
.page-subtitle{font-size:16px; margin-bottom:32px;}
.pdf-list,.material-list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px;}
.pdf-card,.material-card{display:flex; flex-direction:column; border-radius:18px;}
.pdf-content,.material-content{flex:1; display:flex; flex-direction:column; padding:22px;}
.material-subject{display:block;}
.pdf-title,.material-title{font-size:20px; overflow-wrap:anywhere;}
.pdf-subject,.material-subject{font-size:14px;}
.pdf-description,.material-description{font-size:15px;}
.pdf-actions,.material-actions{margin-top:auto; padding-top:6px; gap:12px;}
.open,.download{min-height:48px; font-size:15px;}
.empty{grid-column:1 / -1; font-size:15px;}
.bottom-nav{display:none !important;}
.home-footer{display:block; text-align:center; padding:32px 20px; border-top:1px solid var(--border); background:var(--bg);}
.home-footer h2{margin:0; font-size:19px; font-weight:800; color:var(--text);}
.home-footer h2 span{color:#9b5cff;}
.home-footer p{margin:6px 0 0; font-size:11px; color:var(--muted);}
}
@media(min-width:1280px){
.pdf-list,.material-list{grid-template-columns:repeat(3,minmax(0,1fr));}
}

</style>

</head>

<body>

<header class="ssc-head">
  <div class="brand"><strong>SSC <span>EDGE</span></strong></div>
  <div class="header-tagline">Learn • Practice • Improve</div>
</header>


<div class="container">

<a class="ssc-back" href="study.html">← Back</a>

<div class="page-title">
English
</div>

<div class="page-subtitle">
SSC EDGE English PDFs
</div>

<div id="pdfList" class="pdf-list">

<div class="empty">
Loading PDFs...
</div>

</div>

</div>

<footer class="home-footer">
  <h2>SSC <span>EDGE</span></h2>
  <p>Learn • Practice • Improve</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==========================================
   DOWNLOAD URL
   ========================================== */

function getDownloadUrl(url){

if(!url){
return "";
}

if(url.includes("?")){
return url + "&download";
}

return url + "?download";

}


function recordDownload(
id,
title,
subject,
url
){

if(window.SSCEdgeDownloads){

window.SSCEdgeDownloads.recordDownload({

id:id,
title:title,
subject:subject,
type:"PDF",
url:url

});

}

}


/* ==========================================
   STUDY MATERIAL PROGRESS
   ========================================== */

async function markStudyMaterialComplete(materialId){

try{

const {
data: {
user
}
} =
await supabaseClient.auth.getUser();


if(!user){

return;

}


const {
error
} =
await supabaseClient

.from("study_material_progress")

.upsert(

{
user_id:user.id,

material_id:Number(materialId),

completed:true,

completed_at:new Date().toISOString()
},

{
onConflict:"user_id,material_id"
}

);


if(error){

console.warn(
"Study progress could not be saved:",
error
);

}

}catch(error){

console.warn(
"Study progress error:",
error
);

}

}


async function loadPDFs(){

const pdfList =
document.getElementById("pdfList");


const {
data: subject,
error: subjectError
} = await supabaseClient

.from("subjects")

.select("id,name")

.eq("name","English")

.single();


if(subjectError || !subject){

pdfList.innerHTML =
`<div class="empty">
Unable to load English subject.
</div>`;

return;

}


const {
data: pdfs,
error
} = await supabaseClient

.from("study_material")

.select("*")

.eq("material_type","PDF")

.eq("subject_id",subject.id)

.eq("is_active",true)

.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

pdfList.innerHTML =
`<div class="empty">
Unable to load PDFs.
</div>`;

return;

}


if(!pdfs || pdfs.length === 0){

pdfList.innerHTML =
`<div class="empty">
No English PDFs available yet.
</div>`;

return;

}


pdfList.innerHTML =
pdfs.map(pdf => {

const rawTitle =
pdf.title || "Untitled PDF";

const rawDescription =
pdf.description || "";

const rawUrl =
pdf.file_url || "";

const id =
escapeHtml(pdf.id || rawUrl);

const title =
escapeHtml(rawTitle);

const description =
escapeHtml(rawDescription);

const openUrl =
escapeHtml(rawUrl);

const downloadUrl =
escapeHtml(getDownloadUrl(rawUrl));


return `

<div class="pdf-card">

<div class="pdf-content">

<div class="pdf-title">
${title}
</div>

<div class="pdf-subject">
📚 ${escapeHtml(subject.name)}
</div>

${description ? `

<div class="pdf-description">
${description}
</div>

` : ""}

<div class="pdf-actions">

<a
class="open"
href="pdf-viewer.html?file=${encodeURIComponent(rawUrl)}&title=${encodeURIComponent(rawTitle)}"
target="_blank"
rel="noopener"
data-material-id="${id}">

📄 Open PDF

</a>

<a
class="download"
href="${downloadUrl}"
download
onclick="recordDownload(
'${id.replace(/'/g,"\\'")}',
'${title.replace(/'/g,"\\'")}',
'${escapeHtml(subject.name).replace(/'/g,"\\'")}',
'${openUrl.replace(/'/g,"\\'")}'
)">

📥 Download

</a>

</div>

</div>

</div>

`;

}).join("");


/* ==========================================
   OPEN PDF PROGRESS TRACKING
   ========================================== */

document
.querySelectorAll(".open[data-material-id]")
.forEach(button => {

button.addEventListener(
"click",
function(){

markStudyMaterialComplete(
this.dataset.materialId
);

}
);

});

}


loadPDFs();

</script>

</body>
</html>
