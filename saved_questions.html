<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0 0 40px;
}

.page{
    max-width:900px;
    margin:auto;
    padding:16px 14px 40px;
}

/* BACK */

.back{
    display:inline-block;
    margin-bottom:14px;
    color:var(--purple2);
    text-decoration:none;
    font-size:13px;
    font-weight:900;
}

/* HEADER */

.head{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
}

.head-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.head h1{
    margin:0;
    color:var(--text);
    font-size:21px;
    line-height:1.3;
}

/* SUBJECT BUTTON */

.subject-wrap{
    position:relative;
    flex-shrink:0;
}

.subject-btn{
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    border-radius:10px;
    padding:9px 11px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    white-space:nowrap;
}

.subject-btn:active{
    transform:scale(.97);
}

.subject-menu{
    position:absolute;
    top:calc(100% + 7px);
    right:0;
    width:190px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:6px;
    z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:none;
}

.subject-menu.show{
    display:block;
}

.subject-option{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    padding:10px;
    border-radius:8px;
    text-align:left;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.subject-option:hover{
    background:var(--card2);
}

.subject-option.active{
    background:var(--purple);
    color:#fff;
}

.sub{
    margin:7px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

/* STATUS */

.status{
    text-align:center;
    color:var(--muted);
    padding:28px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    font-size:13px;
    line-height:1.5;
}

.empty-icon{
    font-size:36px;
    margin-bottom:8px;
}

/* SUBJECT GROUP */

.subject-group{
    margin-top:20px;
}

.subject-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 10px;
    padding:0 2px;
}

.subject-heading h2{
    margin:0;
    color:var(--text);
    font-size:16px;
    font-weight:900;
}

.subject-count{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
}

/* HORIZONTAL SLIDES */

.question-slider{
    display:flex;
    gap:12px;

    overflow-x:auto;
    overflow-y:hidden;

    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;

    padding:2px 2px 14px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;
}

.question-slider::-webkit-scrollbar{
    display:none;
}

/* QUESTION CARD */

.question-card{
    flex:0 0 100%;
    width:100%;

    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;

    overflow:hidden;

    scroll-snap-align:start;
}

/* TOP */

.q-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    padding-bottom:9px;

    border-bottom:1px solid var(--border);
}

.q-number{
    color:var(--text);
    font-size:14px;
    font-weight:900;
}

.bookmark{
    font-size:20px;
    line-height:1;
}

/* QUESTION */

.question{
    margin-top:12px;

    color:var(--text);

    font-size:14px;
    font-weight:700;

    line-height:1.65;

    overflow-wrap:anywhere;
}

/* OPTIONS */

.options{
    margin-top:12px;
}

.option{
    padding:10px 11px;

    margin-top:7px;

    border:1px solid var(--border);

    border-radius:10px;

    color:var(--text);

    font-size:12px;

    line-height:1.55;

    overflow-wrap:anywhere;
}

.option.correct{
    border-color:#2fbf71;
    background:rgba(47,191,113,.10);
}

.option.correct b{
    color:#2fbf71;
}

/* ANSWER */

.answer-box{
    margin-top:13px;

    padding:12px;

    border-radius:11px;

    background:var(--card2);

    border:1px solid var(--border);

    color:var(--text);

    font-size:13px;

    line-height:1.6;

    overflow-wrap:anywhere;
}

.answer-box strong{
    color:#2fbf71;
}

/* SLIDE INDICATOR */

.slide-hint{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    margin:-3px 0 8px;
}

/* BUTTONS */

.actions{
    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:8px;

    margin-top:8px;
}

.btn{
    display:flex;

    align-items:center;

    justify-content:center;

    min-height:42px;

    padding:8px 10px;

    border-radius:10px;

    background:var(--card2);

    border:1px solid var(--border);

    color:var(--text);

    text-decoration:none;

    font-size:11px;

    font-weight:900;

    text-align:center;

    cursor:pointer;
}

.btn.primary{
    background:var(--purple);

    border-color:var(--purple);

    color:#fff;
}

.btn:disabled{
    opacity:.45;
    cursor:default;
}

.open-test{
    margin-top:14px;
}

@media(max-width:500px){

    .head-top{
        align-items:flex-start;
    }

    .head h1{
        font-size:19px;
    }

    .subject-btn{
        padding:8px 9px;
    }

    .question-card{
        padding:14px;
    }

    .actions{
        grid-template-columns:1fr 1fr 1fr;
    }

}

/* one step back inside the site; otherwise follow the link */
function sscBack(){
  try{
    const r = document.referrer && new URL(document.referrer);
    if(r && history.length > 1 && r.origin === location.origin &&
       !/(^|\/)(index(\.html)?)?$/.test(r.pathname)){
      history.back();
      return false;
    }
  }catch(e){}
  return true;
}

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   ELEMENTS
========================================== */

const app =
document.getElementById("app");

const count =
document.getElementById("count");

const subjectButton =
document.getElementById("subjectButton");

const subjectMenu =
document.getElementById("subjectMenu");


/* ==========================================
   CURRENT FILTER
========================================== */

let selectedSubject = "all";

let allQuestionData = [];


/* ==========================================
   ESCAPE HTML
========================================== */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   CHECK CORRECT OPTION
========================================== */

function isCorrectOption(option){

    return (

        option.is_correct === true ||

        option.is_correct === "true" ||

        option.is_correct === 1 ||

        option.is_correct === "1"

    );

}


/* ==========================================
   SUBJECT NAME
========================================== */

function normalizeSubjectName(name){

    const value =
        String(name || "")
        .trim()
        .toLowerCase();


    if(
        value.includes("quant") ||
        value.includes("math")
    ){
        return "Quantitative Aptitude";
    }


    if(
        (
            value.includes("general") &&
            value.includes("aware")
        ) ||
        value === "gk" ||
        value.includes("general awareness")
    ){
        return "General Awareness";
    }


    if(
        value.includes("reason")
    ){
        return "Reasoning";
    }


    if(
        value.includes("english")
    ){
        return "English";
    }


    return name || "Other";

}


/* ==========================================
   GET SAVED QUESTIONS
========================================== */

function getSavedEntries(){

    const entries = [];


    for(
        let i = 0;
        i < localStorage.length;
        i++
    ){

        const key =
            localStorage.key(i);


        if(
            !key ||
            !key.startsWith(
                "ssc-edge-saved-questions-"
            )
        ){
            continue;
        }


        const testId =
            key.substring(
                "ssc-edge-saved-questions-".length
            );


        try{

            const ids =
                JSON.parse(
                    localStorage.getItem(key)
                );


            if(Array.isArray(ids)){

                ids.forEach(id=>{

                    entries.push({

                        testId:
                            String(testId),

                        questionId:
                            String(id)

                    });

                });

            }

        }catch(error){

            console.warn(
                "Could not read saved questions:",
                error
            );

        }

    }


    return entries;

}


/* ==========================================
   REMOVE SAVED QUESTION
========================================== */

function removeSaved(
    testId,
    questionId
){

    const key =
        "ssc-edge-saved-questions-" +
        String(testId);


    try{

        const saved =
            JSON.parse(
                localStorage.getItem(key) || "[]"
            );


        const ids =
            Array.isArray(saved)
            ? saved.map(x=>String(x))
            : [];


        const next =
            ids.filter(
                id =>
                    id !== String(questionId)
            );


        if(next.length){

            localStorage.setItem(
                key,
                JSON.stringify(next)
            );

        }else{

            localStorage.removeItem(key);

        }


        loadSavedQuestions();

    }catch(error){

        console.warn(
            "Could not remove saved question:",
            error
        );

    }

}


/* ==========================================
   PREVIOUS / NEXT
========================================== */

function moveQuestion(
    button,
    direction
){

    const slider =
        button.closest(
            ".question-slider"
        );


    if(!slider){
        return;
    }


    const card =
        slider.querySelector(
            ".question-card"
        );


    if(!card){
        return;
    }


    const amount =
        card.getBoundingClientRect().width +
        12;


    slider.scrollBy({

        left:
            direction === "next"
            ? amount
            : -amount,

        behavior:"smooth"

    });

}


/* ==========================================
   LOAD TEST DATA
========================================== */

async function loadTestData(
    testId,
    questionIds
){

    /* TEST + ASSIGNMENTS TOGETHER */

    const [
        testResult,
        assignmentResult
    ] = await Promise.all([

        db
            .from("mock_tests")
            .select("id,title")
            .eq("id",testId)
            .maybeSingle(),

        db
            .from("mock_test_questions")
            .select(
                "question_id,question_order,section_id"
            )
            .eq(
                "mock_test_id",
                testId
            )
            .order(
                "question_order",
                {ascending:true}
            )

    ]);


    if(testResult.error){

        throw testResult.error;

    }


    if(assignmentResult.error){

        throw assignmentResult.error;

    }


    const assignments =
        (assignmentResult.data || [])
            .filter(
                a =>
                    questionIds.includes(
                        String(a.question_id)
                    )
            );


    if(!assignments.length){

        return {

            title:
                testResult.data?.title ||
                "SSC EDGE Test",

            questions:[]

        };

    }


    const ids =
        assignments.map(
            a => a.question_id
        );


    const sectionIds =
    [
        ...new Set(

            assignments
                .map(
                    a => a.section_id
                )
                .filter(
                    x =>
                        x !== null &&
                        x !== undefined
                )

        )
    ];


    /* QUESTIONS + OPTIONS + SECTIONS TOGETHER */

    const [
        questionResult,
        optionResult,
        sectionResult
    ] = await Promise.all([

        db
            .from("questions")
            .select("*")
            .in("id",ids),

        db
            .from("question_options")
            .select(
                "*"
            )
            .in("question_id",ids)
            .order(
                "id",
                {ascending:true}
            ),

        sectionIds.length

        ?

        db
            .from("mock_test_sections")
            .select(
                "id,subject_id,section_order"
            )
            .in(
                "id",
                sectionIds
            )
            .order(
                "section_order",
                {ascending:true}
            )

        :

        Promise.resolve({
            data:[],
            error:null
        })

    ]);


    if(questionResult.error){

        throw questionResult.error;

    }


    if(optionResult.error){

        throw optionResult.error;

    }


    if(sectionResult.error){

        throw sectionResult.error;

    }


    const sections =
        sectionResult.data || [];


    /* SUBJECT IDS */

    const subjectIds =
    [
        ...new Set(

            [

                ...(questionResult.data || [])
                    .map(
                        q =>
                            q.subject_id
                    ),

                ...sections
                    .map(
                        s =>
                            s.subject_id
                    )

            ]
            .filter(
                x =>
                    x !== null &&
                    x !== undefined
            )

        )
    ];


    let subjects = [];


    if(subjectIds.length){

        const subjectResult =
            await db
                .from("subjects")
                .select("id,name")
                .in(
                    "id",
                    subjectIds
                );


        if(!subjectResult.error){

            subjects =
                subjectResult.data || [];

        }

    }


    /* MAP DATA */

    const questionMap =
        new Map(

            (questionResult.data || [])
                .map(
                    q =>
                    [
                        String(q.id),
                        q
                    ]
                )

        );


    const optionsMap =
        new Map();


    (optionResult.data || [])
        .forEach(option=>{

            const key =
                String(option.question_id);


            if(
                !optionsMap.has(key)
            ){

                optionsMap.set(
                    key,
                    []
                );

            }


            optionsMap
                .get(key)
                .push(option);

        });


    const sectionMap =
        new Map(

            sections.map(
                s =>
                [
                    String(s.id),
                    s
                ]
            )

        );


    const subjectMap =
        new Map(

            subjects.map(
                s =>
                [
                    String(s.id),
                    s.name
                ]
            )

        );


    /* BUILD QUESTIONS */

    const questions =
        assignments

            .map(a=>{

                const q =
                    questionMap.get(
                        String(a.question_id)
                    );


                if(!q){

                    return null;

                }


                const section =
                    sectionMap.get(
                        String(a.section_id)
                    );


                const rawSubject =

                    subjectMap.get(
                        String(q.subject_id)
                    )

                    ||

                    subjectMap.get(
                        String(section?.subject_id)
                    )

                    ||

                    q.subject_name

                    ||

                    q.subject

                    ||

                    section?.subject_name

                    ||

                    section?.subject

                    ||

                    "";


                const subjectName =
                    normalizeSubjectName(
                        rawSubject
                    );


                return {

                    ...q,

                    question_order:
                        a.question_order,

                    subjectName:
                        subjectName,

                    options:
                        optionsMap.get(
                            String(q.id)
                        ) || []

                };

            })

            .filter(Boolean);


    return {

        title:
            testResult.data?.title ||
            "SSC EDGE Test",

        questions:
            questions

    };

}


/* ==========================================
   RENDER QUESTIONS
========================================== */

function renderQuestions(){

    const filtered =

        selectedSubject === "all"

        ?

        allQuestionData

        :

        allQuestionData.filter(
            item =>
                item.question.subjectName ===
                selectedSubject
        );


    if(!filtered.length){

        app.innerHTML = `

            <div class="status">

                <div class="empty-icon">
                    🔖
                </div>

                <div>
                    No saved questions in
                    ${esc(selectedSubject)}
                </div>

            </div>

        `;

        count.textContent =
            "🔖 0 Saved Questions";

        return;

    }


    /* GROUP BY SUBJECT */

    const groups =
        new Map();


    filtered.forEach(item=>{

        const subject =
            item.question.subjectName ||
            "Other";


        if(!groups.has(subject)){

            groups.set(
                subject,
                []
            );

        }


        groups
            .get(subject)
            .push(item);

    });


    let html = "";

    let total = 0;


    groups.forEach(
        (items,subject)=>{

            total += items.length;


            html += `

                <section class="subject-group">

                    <div class="subject-heading">

                        <h2>
                            ${esc(subject)}
                        </h2>

                        <span class="subject-count">
                            ${items.length}
                            ${
                                items.length === 1
                                ? "Question"
                                : "Questions"
                            }
                        </span>

                    </div>


                    <div class="slide-hint">
                        Swipe left/right to view questions
                    </div>


                    <div class="question-slider">

            `;


            items.forEach(
                (item,index)=>{

                    const q =
                        item.question;

                    const correct =
                        q.options.find(
                            isCorrectOption
                        );


                    /* OPTIONS */

                    const opts =
                        q.options.length

                        ?

                        `

                        <div class="options">

                            ${
                                q.options
                                    .map(
                                        (o,i)=>`

                                            <div
                                                class="option ${
                                                    isCorrectOption(o)
                                                    ? "correct"
                                                    : ""
                                                }"
                                            >

                                                <b>
                                                    ${
                                                        esc(
                                                            o.option_label ||
                                                            String.fromCharCode(
                                                                65+i
                                                            )
                                                        )
                                                    }
                                                </b>

                                                ${
                                                    o.option_text
                                                    ?
                                                    " " +
                                                    esc(
                                                        o.option_text
                                                    )
                                                    :
                                                    ""
                                                }

                                                ${
                                                    isCorrectOption(o)
                                                    ?
                                                    " ✓"
                                                    :
                                                    ""
                                                }

                                            </div>

                                        `
                                    )
                                    .join("")
                            }

                        </div>

                        `

                        :

                        "";


                    /* ANSWER */

                    const answerText =

                        correct

                        ?

                        (
                            (correct.option_label || "") +

                            (
                                correct.option_text
                                ?
                                " " +
                                correct.option_text
                                :
                                ""
                            )
                        )

                        :

                        "Correct answer is not available.";


                    html += `

                        <article
                            class="question-card"
                        >

                            <div class="q-top">

                                <span class="q-number">

                                    Question
                                    ${esc(q.question_order)}

                                </span>


                                <span
                                    class="bookmark"
                                    title="Saved Question"
                                >
                                    🔖
                                </span>

                            </div>


                            <div class="question">

                                ${esc(q.question_text)}

                            </div>


                            ${opts}


                            <div class="answer-box">

                                <strong>
                                    Correct Answer:
                                </strong>

                                ${esc(answerText)}


                            <!-- OPEN TEST -->

                            <a
                                class="btn primary open-test"
                                href="solutions.html?test_id=${encodeURIComponent(item.testId)}"
                            >

                                Open Test

                            </a>


                            <!-- PREVIOUS / REMOVE / NEXT -->

                            <div class="actions">

                                <button
                                    class="btn"
                                    type="button"
                                    onclick="
                                        moveQuestion(
                                            this,
                                            'prev'
                                        )
                                    "
                                >

                                    Previous

                                </button>


                                <button
                                    class="btn"
                                    type="button"
                                    onclick="
                                        removeSaved(
                                            '${esc(item.testId)}',
                                            '${esc(q.id)}'
                                        )
                                    "
                                >

                                    Remove

                                </button>


                                <button
                                    class="btn primary"
                                    type="button"
                                    onclick="
                                        moveQuestion(
                                            this,
                                            'next'
                                        )
                                    "
                                >

                                    Next

                                </button>

                            </div>

                        </article>

                    `;

                }

            );


            html += `

                    </div>

                </section>

            `;

        }

    );


    app.innerHTML =
        html;


    count.textContent =

        "🔖 " +

        total +

        (
            total === 1
            ? " Saved Question"
            : " Saved Questions"
        );

}


/* ==========================================
   LOAD SAVED QUESTIONS
========================================== */

async function loadSavedQuestions(){

    app.innerHTML = `
        <div class="status">
            Loading saved questions...
        </div>
    `;


    const entries =
        getSavedEntries();


    /* NO SAVED QUESTIONS */

    if(!entries.length){

        allQuestionData = [];
        svLoaded = true;
        svRender();

        count.textContent =
            "🔖 0 Saved Questions";


        app.innerHTML = `

            <div class="status">

                <div class="empty-icon">
                    🔖
                </div>

                <div>
                    No saved questions yet.
                </div>

                <div style="margin-top:6px;">
                    Save questions from a test
                    to revise them later.
                </div>

            </div>

        `;

        return;

    }


    /* GROUP BY TEST */

    const grouped =
        new Map();


    entries.forEach(entry=>{

        if(
            !grouped.has(
                entry.testId
            )
        ){

            grouped.set(
                entry.testId,
                []
            );

        }


        grouped
            .get(entry.testId)
            .push(
                entry.questionId
            );

    });


    allQuestionData = [];


    /*
       LOAD EVERY SAVED TEST
       IN PARALLEL
    */

    const groupedEntries =
        [...grouped.entries()];


    const results =
        await Promise.all(

            groupedEntries.map(
                async ([testId,questionIds])=>{

                    try{

                        const data =
                            await loadTestData(
                                testId,
                                questionIds
                            );


                        return {

                            testId:
                                String(testId),

                            title:
                                data.title,

                            questions:
                                data.questions || []

                        };

                    }catch(error){

                        console.error(
                            "Saved question load error:",
                            error
                        );

                        return {

                            testId:
                                String(testId),

                            questions:[]

                        };

                    }

                }
            )

        );


    results.forEach(result=>{

        result.questions.forEach(q=>{

            allQuestionData.push({

                testId:
                    result.testId,

                testTitle:
                    result.title,

                question:q

            });

        });

    });


    svLoaded = true;
    svRender();


    if(!allQuestionData.length){

        count.textContent =
            "🔖 0 Saved Questions";


        app.innerHTML = `

            <div class="status">

                <div>
                    Saved questions could not be loaded.
                </div>

                <div style="margin-top:6px;">
                    The saved test/question may
                    no longer exist.
                </div>

            </div>

        `;

        return;

    }


    /* RESET FILTER */

    selectedSubject = "all";

    document
        .querySelectorAll(".subject-option")
        .forEach(btn=>{

            btn.classList.toggle(
                "active",
                btn.dataset.subject === "all"
            );

        });


    subjectButton.textContent =
        "Subject ▾";


    renderQuestions();

}

   SUBJECT DROPDOWN
========================================== */

subjectButton.addEventListener(

        event.stopPropagation();

/* ==========================================
   DESKTOP: 4 SUBJECT CARDS + SOLUTION VIEW
========================================== */

const SV_SUBJECTS = [
    ["quant","Quantitative Aptitude","🔢"],
    ["english","English","📖"],
    ["reasoning","Reasoning","🧩"],
    ["gk","General Awareness","🌍"]
];

let svLoaded = false;
let svLang = "default";
const svPosition = {};

const sv = id => document.getElementById(id);

function svIsSaved(item){
    try{
        const ids = JSON.parse(
            localStorage.getItem("ssc-edge-saved-questions-" + item.testId) || "[]"
        );
        return Array.isArray(ids) &&
            ids.map(String).includes(String(item.question.id));
    }catch(error){
        return false;
    }
}

/* the 4 subjects, plus "Other" only if something does not match them */
function svSubjectList(){
    const names = SV_SUBJECTS.map(s => s[1]);
    const other = allQuestionData.some(
        item => !names.includes(item.question.subjectName)
    );
    return other
        ? SV_SUBJECTS.concat([["other","Other","📌"]])
        : SV_SUBJECTS;
}

function svItems(slug){
    const names = SV_SUBJECTS.map(s => s[1]);
    const found = SV_SUBJECTS.find(s => s[0] === slug);
    return allQuestionData.filter(item =>
        found
        ? item.question.subjectName === found[1]
        : !names.includes(item.question.subjectName)
    );
}

/* subject in the address bar, else the first subject that has saved questions */
function svSlug(){
    const slug = location.hash.slice(1);
    if(SV_SUBJECTS.some(s => s[0] === slug) || slug === "other"){
        return slug;
    }
    const first = svSubjectList().find(s => svItems(s[0]).length);
    return first ? first[0] : SV_SUBJECTS[0][0];
}

function svText(obj,keys){
    for(const key of keys){
        const value = obj && obj[key];
        if(value != null && String(value).trim() !== ""){
            return String(value);
        }
    }
    return "";
}

const SV_Q_HI = ["question_text_hindi","question_text_hi","hindi_question_text","question_hi","question_text_hin","question_hin"];
const SV_Q_EN = ["question_text_en","question_en","english_question_text","question_text"];
const SV_O_HI = ["option_text_hindi","option_text_hi","hindi_option_text","option_hi","option_text_hin","option_hin"];
const SV_O_EN = ["option_text_en","option_en","english_option_text","option_text"];
const SV_E_HI = ["explanation_hindi","explanation_hi","hindi_explanation","solution_hindi","solution_hi"];
const SV_E_EN = ["explanation_en","explanation_english","english_explanation","explanation","solution_en"];

function svPick(obj,hindi,english){
    return svLang === "hi"
        ? svText(obj,hindi) || svText(obj,english)
        : svText(obj,english) || svText(obj,hindi);
}

function svRender(){

    const slug = svSlug();

    /* fix the subject once loaded, so it does not jump while editing */
    if(svLoaded && allQuestionData.length && location.hash !== "#" + slug){
        history.replaceState(history.state,"","#" + slug);
    }

    svRenderView(slug);

}

function svRenderView(slug){

    const list = svSubjectList();
    const subject = list.find(s => s[0] === slug) || [slug,"Other"];
    const items = svItems(slug);

    sv("svCenterSub").textContent = subject[1];
    sv("svPalTitle").textContent = subject[1];

    sv("svTabs").innerHTML = list.map(s =>
        `<button type="button" data-slug="${s[0]}" class="${
            s[0] === slug ? "current" : ""
        }">${s[1]} (${svItems(s[0]).filter(svIsSaved).length})</button>`
    ).join("");

    document.body.classList.toggle("sv-none",!items.length);

    if(!items.length){
        sv("svEmpty").innerHTML =
            !svLoaded
            ? "Loading saved questions..."
            : !allQuestionData.length && getSavedEntries().length
            ? "Saved questions could not be loaded."
            : `🔖<br>No saved questions in ${esc(subject[1])} yet.<br>Save questions from a test to revise them later.`;
        return;
    }

    const pos = Math.min(svPosition[slug] || 0,items.length - 1);
    svPosition[slug] = pos;

    const item = items[pos];
    const q = item.question;
    const saved = svIsSaved(item);

    sv("svCount").textContent =
        "Question " + (pos + 1) + " of " + items.length;

    sv("svTest").textContent =
        (item.testTitle || "SSC EDGE Test") +
        (q.question_order != null ? " • Q" + q.question_order : "");

    sv("svOpen").href =
        "solutions.html?test_id=" + encodeURIComponent(item.testId);

    const hindi =
        !!svText(q,SV_Q_HI.concat(SV_E_HI)) ||
        q.options.some(o => svText(o,SV_O_HI));

    sv("svLang").style.display = hindi ? "" : "none";
    sv("svLang").textContent = svLang === "hi" ? "अ / A" : "A / अ";
    sv("svLang").classList.toggle("active",svLang === "hi");

    sv("svMark").classList.toggle("active",saved);
    sv("svSave").textContent = saved ? "Saved" : "Save Question";
    sv("svSave").classList.toggle("saved",saved);
    sv("svPrev").disabled = pos <= 0;
    sv("svNext").disabled = pos >= items.length - 1;

    const label = (o,i) => o.option_label || String.fromCharCode(65 + i);
    const index = q.options.findIndex(isCorrectOption);

    sv("svCard").innerHTML = `
        <div class="sv-qtext">${esc(svPick(q,SV_Q_HI,SV_Q_EN))}</div>
        <div class="sv-options">${
            q.options.map((o,i) => `
                <div class="sv-option ${isCorrectOption(o) ? "correct" : ""}">
                    <b>${esc(label(o,i))}</b>
                    <span>${esc(svPick(o,SV_O_HI,SV_O_EN))}</span>
                </div>`
            ).join("")
        }</div>
        <div class="sv-answer">Correct Answer: ${
            index < 0
            ? "Not available"
            : esc("(" + label(q.options[index],index) + ") " +
                  svPick(q.options[index],SV_O_HI,SV_O_EN))
        }</div>
        <div class="sv-explain">
            <strong>Explanation</strong>
            <div>${esc(
                svPick(q,SV_E_HI,SV_E_EN) ||
                "No explanation has been added for this question yet."
            )}</div>
        </div>`;

    sv("svNumbers").innerHTML = items.map((it,i) =>
        `<button type="button" data-pos="${i}" class="${
            svIsSaved(it) ? "on" : ""
        }${i === pos ? " current" : ""}">${i + 1}</button>`
    ).join("");

}

function svMove(step){
    const slug = svSlug();
    svPosition[slug] = (svPosition[slug] || 0) + step;
    svRender();
    window.scrollTo(0,0);
}

/* save / unsave; the question stays on screen so it can be saved again */
function svToggle(){
    const slug = svSlug();
    const item = svItems(slug)[svPosition[slug] || 0];
    if(!item){
        return;
    }
    const key = "ssc-edge-saved-questions-" + item.testId;
    try{
        let ids = JSON.parse(localStorage.getItem(key) || "[]");
        ids = Array.isArray(ids) ? ids.map(String) : [];
        const id = String(item.question.id);
        ids = ids.includes(id) ? ids.filter(x => x !== id) : ids.concat(id);
        if(ids.length){
            localStorage.setItem(key,JSON.stringify(ids));
        }else{
            localStorage.removeItem(key);
        }
    }catch(error){
        console.warn("Could not update saved question:",error);
    }
    svRender();
}

/* removed questions disappear once the subject is left */
function svClean(){
    if(!svLoaded){
        return;
    }
    allQuestionData = allQuestionData.filter(svIsSaved);
    if(allQuestionData.length){
        renderQuestions();
    }
}

sv("svTabs").addEventListener("click",event => {
    const tab = event.target.closest("[data-slug]");
    if(!tab){
        return;
    }
    svClean();
    history.replaceState(history.state,"","#" + tab.dataset.slug);
    svRender();
    window.scrollTo(0,0);
});

sv("svNumbers").addEventListener("click",event => {
    const button = event.target.closest("[data-pos]");
    if(button){
        svPosition[svSlug()] = Number(button.dataset.pos);
        svRender();
        window.scrollTo(0,0);
    }
});

sv("svPrev").onclick = () => svMove(-1);
sv("svNext").onclick = () => svMove(1);
sv("svSave").onclick = svToggle;
sv("svMark").onclick = svToggle;

sv("svLang").onclick = () => {
    svLang = svLang === "hi" ? "default" : "hi";
    svRender();
};

sv("svTab").onclick = () => document.body.classList.toggle("sv-closed");

/* one step back (profile if there is no page to go back to) */
sv("svBack").onclick = () => {
    if(sscBack()){
        location.href = "profile.html";
    }
};

window.addEventListener("popstate",svRender);

/* ==========================================
   START
========================================== */

svRender();
loadSavedQuestions();

</script>
