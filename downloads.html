<script>
/* one step back inside the site; otherwise follow the link */
function sscBack(){
  try{
    const r = document.referrer && new URL(document.referrer);
    if(r && history.length > 1 && r.origin === location.origin &&
       !/(^|\/)(index(\.html)?)?$/.test(r.pathname)){
      history.back();
      return false;
    }
  }catch(e){}
  return true;
}
</script>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";


const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   DOWNLOAD STORAGE
========================================================= */

const DOWNLOAD_KEY =
"ssc-edge-downloads-v3";


const OLD_DOWNLOAD_KEY =
"ssc-edge-downloads-v2";


let currentType =
"ALL";


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   GET DOWNLOADS
========================================================= */

function getDownloads(){

    try{

        return JSON.parse(

            localStorage.getItem(
                DOWNLOAD_KEY
            ) || "[]"

        );

    }catch(error){

        return [];

    }

}


/* =========================================================
   SAVE DOWNLOADS
========================================================= */

function saveDownloads(items){

    localStorage.setItem(

        DOWNLOAD_KEY,

        JSON.stringify(items)

    );

}


/* =========================================================
   REFRESH FILE URLS
=========================================================

   Get the current file_url directly
   from study_material.

   No bucket is created or changed.
========================================================= */

async function refreshFileUrls(items){

    if(!items.length){

        return items;

    }


    const status =
        document.getElementById(
            "refreshStatus"
        );


    status.style.display =
        "block";


    let changed =
        false;


    for(
        let i = 0;
        i < items.length;
        i++
    ){

        const item =
            items[i];


        /*
           The id saved by the PDF/E-Book
           pages is the study_material id.

           If an old record does not have
           a usable database id, keep its
           existing URL.
        */

        if(
            !item.id ||
            String(item.id).includes("/")
        ){

            continue;

        }


        try{

            const {
                data,
                error
            } = await supabaseClient

                .from("study_material")

                .select(
                    "id,title,subject_id,file_url,material_type"
                )

                .eq(
                    "id",
                    item.id
                )

                .maybeSingle();


            if(
                !error &&
                data &&
                data.file_url
            ){

                /*
                   Always use the exact
                   file_url stored in Supabase.
                */

                if(
                    item.url !==
                    data.file_url
                ){

                    items[i] = {

                        ...item,

                        url:
                            data.file_url,

                        title:
                            data.title ||
                            item.title,

                        type:
                            data.material_type ===
                            "EBOOK"
                                ? "EBOOK"
                                : "PDF"

                    };

                    changed =
                        true;

                }

            }

        }catch(error){

            console.warn(
                "Could not refresh:",
                item.id,
                error
            );

        }

    }


    if(changed){

        saveDownloads(items);

    }


    status.style.display =
        "none";


    return items;

}


/* =========================================================
   DOWNLOAD URL
=========================================================

   IMPORTANT:
   Do NOT convert the Supabase bucket.

   Use the exact file_url saved in
   study_material and simply request
   download behaviour.

   This prevents:
   "Bucket not found"
========================================================= */

function getDownloadUrl(url){

    if(!url){

        return "";

    }


    if(
        url.includes("?")
    ){

        return url + "&download";

    }


    return url + "?download";

}


/* =========================================================
   RENDER
========================================================= */

async function renderDownloads(){

    const list =
        document.getElementById(
            "downloadList"
        );


    let items =
        getDownloads();


    if(
        currentType !==
        "ALL"
    ){

        items =
            items.filter(

                item =>
                    item.type ===
                    currentType

            );

    }


    if(!items.length){

        list.innerHTML = `

            <div class="empty">

                No downloads here yet.

            </div>

        `;

        return;

    }


    /*
       First display the saved list.
    */

    list.innerHTML =

        items.map(

            item =>
                createCard(item)

        ).join("");


    /*
       Refresh URLs from Supabase.
    */

    const allItems =
        await refreshFileUrls(
            getDownloads()
        );


    let refreshedItems =
        allItems;


    if(
        currentType !==
        "ALL"
    ){

        refreshedItems =
            refreshedItems.filter(

                item =>
                    item.type ===
                    currentType

            );

    }


    list.innerHTML =

        refreshedItems.map(

            item =>
                createCard(item)

        ).join("");

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(item){

    const title =
        escapeHtml(

            item.title ||
            "Untitled"

        );


    const subject =
        escapeHtml(

            item.subject ||
            "General"

        );


    const id =
        escapeHtml(

            item.id ||
            ""

        );


    /*
       ORIGINAL URL ONLY.
    */

    const url =
        escapeHtml(

            item.url ||
            ""

        );


    const typeLabel =
        item.type ===
        "EBOOK"

            ? "📚 E-Book"

            : "📄 PDF";


    /*
       Add ?download only.
       NEVER replace the bucket.
    */

    const downloadUrl =
        escapeHtml(

            getDownloadUrl(
                item.url ||
                ""
            )

        );


    return `

    <div class="download-card">


        <div class="download-title">

            🔖 ${title}

        </div>


        <div class="download-meta">

            ${typeLabel}

            •

            ${subject}

        </div>


        <div class="actions">


            <!-- OPEN -->

            <a

                class="action primary"

                href="${url}"

                target="_blank"

                rel="noopener noreferrer"

            >

                📖 Open

            </a>


            <!-- DOWNLOAD -->

            <a

                class="action"

                href="${downloadUrl}"

                download

            >

                ⬇️ Download

            </a>


            <!-- REMOVE -->

            <button

                class="action"

                onclick="removeItem(
                    '${id.replace(
                        /'/g,
                        "\\'"
                    )}'
                )"

            >

                🗑️ Remove

            </button>


        </div>


    </div>

    `;

}


/* =========================================================
   REMOVE ITEM
========================================================= */

function removeItem(id){

    const items =
        getDownloads().filter(

            item =>
                String(item.id) !==
                String(id)

        );


    saveDownloads(items);


    renderDownloads();

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAllDownloads(){

    if(
        !confirm(
            "Clear all downloads?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        DOWNLOAD_KEY
    );


    localStorage.removeItem(
        OLD_DOWNLOAD_KEY
    );


    renderDownloads();

}


/* =========================================================
   TABS
========================================================= */

document

    .querySelectorAll(".tab")

    .forEach(

        tab => {

            tab.addEventListener(

                "click",

                () => {

                    document

                        .querySelectorAll(
                            ".tab"
                        )

                        .forEach(

                            item =>
                                item.classList
                                    .remove(
                                        "active"
                                    )

                        );


                    tab.classList.add(
                        "active"
                    );


                    currentType =
                        tab.dataset.type;


                    renderDownloads();

                }

            );

        }

    );


/* =========================================================
   INITIAL LOAD
========================================================= */

renderDownloads();

</script>
