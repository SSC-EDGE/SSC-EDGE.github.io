.container{
  padding:20px;

}

.page-title{
  font-size:26px;
  font-weight:bold;
  margin-bottom:6px;
}

.page-subtitle{
  color:var(--muted);
  margin-bottom:20px;
}

.pdf-list{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.pdf-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.pdf-content{
  padding:16px;
}

.pdf-title{
  font-size:18px;
  font-weight:bold;
  line-height:1.4;
  margin-bottom:7px;
}

.pdf-subject{
  font-size:13px;
  color:var(--muted);
  margin-bottom:9px;
}

.pdf-description{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:14px;
}

.pdf-actions{
  display:flex;
  gap:10px;
}

.open,
.download{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:11px 10px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  box-sizing:border-box;
}

.open{
  background:var(--purple);
  color:white;
}

.download{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}


/* =========================

========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  height:67px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--border);
  background:var(--header);
  backdrop-filter:blur(14px);
}

.bottom-nav a{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:var(--muted);
  text-decoration:none;
  font-size:9px;
  font-weight:800;
}

.bottom-nav a.active{
  color:#9b5cff;
}

.nav-icon{
  font-size:20px;
  line-height:1;
}


.ssc-back{display:inline-block; margin-bottom:14px; font-size:14px; font-weight:800; color:var(--purple,#8b45ee); text-decoration:none;}
header.ssc-head:where(:not(.keep)), .header-tagline, .home-footer{display:none;}

/* ==================================================
   DESKTOP LAYOUT (960px and wider only)
   ================================================== */
@media(min-width:960px){
body{display:flex; flex-direction:column; min-height:100vh; margin:0; padding:0;}
body header.ssc-head{
  position:sticky; top:0; z-index:98; width:100%; max-width:none; height:96px; margin:0; padding:0 max(32px, calc((100% - max(1200px, 83.333%)) / 2));
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  box-sizing:border-box; background:var(--header); border:0; border-bottom:1px solid var(--border);
}
body .ssc-head .brand{display:block; margin:0; padding:0;}
body .ssc-head .brand strong{display:block; font-size:44px; line-height:1; font-weight:900; color:var(--text);}
body .ssc-head .brand span{color:#9b5cff;}
body .ssc-head .header-tagline{display:block; margin-top:6px; font-size:17px; font-weight:700; line-height:1; color:var(--muted);}
body .container{flex:1 0 auto; box-sizing:border-box; width:100%; max-width:max(1264px, calc(83.333% + 64px)); margin:0 auto; padding:32px 32px 56px;}
.ssc-back{align-self:flex-start; font-size:15px; margin-bottom:20px;}
.page-title{font-size:38px; margin-bottom:8px;}
.page-subtitle{font-size:16px; margin-bottom:32px;}
.pdf-list,.material-list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px;}
.pdf-card,.material-card{display:flex; flex-direction:column; border-radius:18px;}
.pdf-content,.material-content{flex:1; display:flex; flex-direction:column; padding:22px;}
.material-subject{display:block;}
.pdf-title,.material-title{font-size:20px; overflow-wrap:anywhere;}
.pdf-subject,.material-subject{font-size:14px;}
.pdf-description,.material-description{font-size:15px;}
.pdf-actions,.material-actions{margin-top:auto; padding-top:6px; gap:12px;}
.open,.download{min-height:48px; font-size:15px;}
.empty{grid-column:1 / -1; font-size:15px;}
.bottom-nav{display:none !important;}
.home-footer{display:block; text-align:center; padding:32px 20px; border-top:1px solid var(--border); background:var(--bg);}
.home-footer h2{margin:0; font-size:19px; font-weight:800; color:var(--text);}
.home-footer h2 span{color:#9b5cff;}
.home-footer p{margin:6px 0 0; font-size:11px; color:var(--muted);}
}
@media(min-width:1280px){
.pdf-list,.material-list{grid-template-columns:repeat(3,minmax(0,1fr));}
}

</style>

<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   MARK STUDY MATERIAL COMPLETE
========================= */

async function markStudyMaterialComplete(materialId){

  try{

    const result =
      await supabaseClient.auth.getUser();

    const user = result.data.user;

    if(!user){
      return;
    }

    const { error } =
      await supabaseClient
        .from("study_material_progress")
        .upsert(
          {
            user_id: user.id,
            material_id: Number(materialId),
            completed: true,
            completed_at: new Date().toISOString()
          },
          {
            onConflict: "user_id,material_id"
          }
        );

    if(error){
      console.warn(
        "Study progress could not be saved:",
        error
      );
    }

  }catch(error){

    console.warn(
      "Study progress error:",
      error
    );

  }

}


/* =========================
   LOAD QUANT PDFS
========================= */

async function loadPDFs(){

  const list =
    document.getElementById("pdfList");

  try{

    /* =========================
       FIND QUANT SUBJECT
    ========================= */

    const { data: subject, error: subjectError } =
      await supabaseClient
        .from("subjects")
        .select("*")
        .eq("name", "Quantitative Aptitude")
        .maybeSingle();

    if(subjectError){
      throw subjectError;
    }

    if(!subject){

      list.innerHTML = `
        <div class="empty">
          Quant subject not found.
        </div>
      `;

      return;
    }


    /* =========================
       GET PDF MATERIAL
    ========================= */

    const { data: materials, error } =
      await supabaseClient
        .from("study_material")
        .select("*")
        .eq("material_type", "PDF")
        .eq("subject_id", subject.id)
        .eq("is_active", true)
        .order("created_at", {
          ascending:false
        });

    if(error){
      throw error;
    }


    /* =========================
       NO MATERIAL
    ========================= */

    if(!materials || materials.length === 0){

      list.innerHTML = `
        <div class="empty">
          Currently no study material available.
        </div>
      `;

      return;
    }


    /* =========================
       RENDER PDF CARDS
    ========================= */

    list.innerHTML = "";

    materials.forEach(material => {

      const id =
        String(material.id);

      const title =
        material.title ||
        "Untitled PDF";

      const description =
        material.description ||
        "Study material for SSC preparation.";

      const fileUrl =
        material.file_url;

      if(!fileUrl){
        return;
      }


      /* =========================
         DOWNLOAD URL
      ========================= */

      const downloadUrl =
        fileUrl.includes("?")
          ? fileUrl + "&download"
          : fileUrl + "?download";


      /* =========================
         CARD
      ========================= */

      const card =
        document.createElement("div");

      card.className =
        "pdf-card";


      const content =
        document.createElement("div");

      content.className =
        "pdf-content";


      content.innerHTML = `

        <div class="pdf-title">
          ${escapeHTML(title)}
        </div>

        <div class="pdf-subject">
          Quantitative Aptitude
        </div>

        <div class="pdf-description">
          ${escapeHTML(description)}
        </div>

        <div class="pdf-actions">

          <a
            class="open"
            href="pdf-viewer.html?file=${encodeURIComponent(fileUrl)}&title=${encodeURIComponent(title)}"
          >
            📄 Open PDF
          </a>

          <a
            class="download"
            href="${escapeAttribute(downloadUrl)}"
            download
          >
            ⬇ Download
          </a>

        </div>

      `;


      card.appendChild(content);

      list.appendChild(card);


      /* =========================
         PROGRESS TRACKING
         Added safely after DOM
         creation — no template
         string syntax issue.
      ========================= */

      const downloadButton =
        content.querySelector(".download");

      if(downloadButton){

        downloadButton.addEventListener(
          "click",
          function(){

            if(window.SSCEdgeDownloads){

              window.SSCEdgeDownloads.recordDownload({
                id:id,
                title:title,
                subject:"Quantitative Aptitude",
                type:"PDF",
                url:fileUrl
              });

            }

          }
        );

      }

      const openButton =
        content.querySelector(".open");

      if(openButton){

        openButton.addEventListener(
          "click",
          function(){

            markStudyMaterialComplete(id);

          }
        );

      }

    });


  }catch(error){

    console.error(
      "PDF loading error:",
      error
    );

    list.innerHTML = `
      <div class="empty">
        Unable to load study material.
        <br>
        Please try again later.
      </div>
    `;

  }

}


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* =========================
   START
========================= */

loadPDFs();

</script>
