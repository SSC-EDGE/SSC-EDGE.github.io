<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08050e">
<title>PDF Viewer - SSC EDGE</title>
<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--viewer-bg:#08050e;--viewer-card:#171025;--viewer-border:#302044;--viewer-text:#fff;--viewer-muted:#aaa2b9;--viewer-purple:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg,var(--viewer-bg));color:var(--text,var(--viewer-text));font-family:Arial,sans-serif}
.viewer-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--header,#100b19);border-bottom:1px solid var(--border,var(--viewer-border))}
.back-btn,.tool-btn{border:1px solid var(--border,var(--viewer-border));background:var(--card,var(--viewer-card));color:var(--text,var(--viewer-text));border-radius:10px;padding:9px 12px;font-weight:700;text-decoration:none;cursor:pointer}
.brand{font-weight:900;white-space:nowrap}.brand span{color:#a66bff}
.file-title{min-width:0;flex:1;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.download-btn{background:var(--purple,var(--viewer-purple));color:#fff;border:0;border-radius:10px;padding:10px 12px;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
.toolbar{position:sticky;top:58px;z-index:15;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:var(--card,var(--viewer-card));border-bottom:1px solid var(--border,var(--viewer-border))}
.toolbar button{min-width:42px}
#pageInfo{font-size:13px;color:var(--text,var(--viewer-text));min-width:90px;text-align:center}
#status{padding:24px 14px;text-align:center;color:var(--muted,var(--viewer-muted));font-size:14px}
#pages{padding:14px 8px 40px;display:flex;justify-content:center}
.page-wrap{width:100%;max-width:900px;background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.25);min-height:200px}
canvas{display:block;width:100%;height:auto}
#error{display:none;margin:18px;padding:16px;border:1px solid #a33;border-radius:12px;color:#ffb4b4;background:rgba(120,0,0,.12);line-height:1.5}
@media(min-width:700px){#pages{padding:22px}.viewer-header{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<header class="viewer-header">
  <button class="back-btn" type="button" onclick="history.back()">← Back</button>
  <div class="brand">SSC <span>EDGE</span></div>
  <div class="file-title" id="fileTitle">PDF Viewer</div>
  <a class="download-btn" id="downloadBtn" href="#" target="_blank" rel="noopener">↓ Download</a>
</header>

<div class="toolbar">
  <button class="tool-btn" id="prevBtn" type="button">‹</button>
  <span id="pageInfo">Loading…</span>
  <button class="tool-btn" id="nextBtn" type="button">›</button>
  <button class="tool-btn" id="zoomOut" type="button">−</button>
  <button class="tool-btn" id="zoomIn" type="button">+</button>
</div>

<div id="status">Loading PDF…</div>
<div id="error"></div>
<main id="pages"><div class="page-wrap"><canvas id="pdfCanvas"></canvas></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get("file");
  const title = params.get("title") || "PDF Document";
  const titleEl = document.getElementById("fileTitle");
  const statusEl = document.getElementById("status");
  const errorEl = document.getElementById("error");
  const canvas = document.getElementById("pdfCanvas");
  const ctx = canvas.getContext("2d");

  titleEl.textContent = title;
  const downloadBtn = document.getElementById("downloadBtn");
  if(pdfUrl){
    downloadBtn.href = pdfUrl + (pdfUrl.includes("?") ? "&download" : "?download");
  }

  if(!pdfUrl){
    showError("PDF link is missing. Please return to Study Material and try again.");
    return;
  }
  if(!window.pdfjsLib){
    showError("PDF viewer library could not load. Check your internet connection and try again.");
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let pdfDoc = null;
  let pageNum = 1;
  let zoom = 1;

  function showError(message){
    statusEl.style.display = "none";
    errorEl.style.display = "block";
    errorEl.textContent = message;
    document.getElementById("pages").style.display = "none";
  }

  async function renderPage(){
    if(!pdfDoc) return;
    statusEl.style.display = "none";
    const page = await pdfDoc.getPage(pageNum);
    const availableWidth = Math.min(
      document.getElementById("pages").clientWidth - 16, 900
    );
    const baseViewport = page.getViewport({scale:1});
    const fitScale = availableWidth / baseViewport.width;
    const viewport = page.getViewport({scale:fitScale * zoom});
    const outputScale = window.devicePixelRatio || 1;

    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    const renderContext = {
      canvasContext:ctx,
      viewport:viewport,
      transform: outputScale !== 1 ? [outputScale,0,0,outputScale,0,0] : null
    };
    await page.render(renderContext).promise;
    document.getElementById("pageInfo").textContent =
      pageNum + " / " + pdfDoc.numPages;
    document.getElementById("prevBtn").disabled = pageNum <= 1;
    document.getElementById("nextBtn").disabled = pageNum >= pdfDoc.numPages;
  }

  document.getElementById("prevBtn").addEventListener("click", async function(){
    if(pageNum <= 1) return;
    pageNum--;
    await renderPage();
    window.scrollTo(0,0);
  });
  document.getElementById("nextBtn").addEventListener("click", async function(){
    if(pageNum >= pdfDoc.numPages) return;
    pageNum++;
    await renderPage();
    window.scrollTo(0,0);
  });
  document.getElementById("zoomIn").addEventListener("click", renderZoomIn);
  document.getElementById("zoomOut").addEventListener("click", renderZoomOut);

  async function renderZoomIn(){
    zoom = Math.min(zoom + 0.2, 2.5);
    await renderPage();
  }
  async function renderZoomOut(){
    zoom = Math.max(zoom - 0.2, 0.6);
    await renderPage();
  }

  window.addEventListener("resize", function(){
    if(pdfDoc) renderPage().catch(function(){});
  });

  pdfjsLib.getDocument({url:pdfUrl}).promise.then(function(doc){
    pdfDoc = doc;
    renderPage().catch(function(err){
      showError("Unable to render this PDF: " + (err.message || "Unknown error"));
    });
  }).catch(function(err){
    showError(
      "Unable to display this PDF inside SSC EDGE. This may be a storage CORS restriction. " +
      "Use Download to access the file. Details: " + (err.message || "PDF loading failed")
    );
  });
})();
</script>
</body>
</html>
