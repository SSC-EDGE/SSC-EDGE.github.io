<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08050e"><title>PDF Viewer - SSC EDGE</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("ssc-edge-theme")||"dark";</script>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%}
body{background:var(--bg,#08050e);color:var(--text,#fff);font-family:Arial,sans-serif;overflow:hidden}
.viewer-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--header,#100b19);border-bottom:1px solid var(--border,#302044)}
.back-btn,.tool-btn{border:1px solid var(--border,#302044);background:var(--card,#171025);color:var(--text,#fff);border-radius:9px;padding:9px 10px;font-weight:700;cursor:pointer}
.brand{font-weight:900;white-space:nowrap}.brand span{color:#a66bff}
.file-title{min-width:0;flex:1;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.download-btn{background:var(--purple,#7c3aed);color:#fff;border:0;border-radius:9px;padding:9px 10px;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}
.toolbar{position:relative;z-index:25;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;background:var(--card,#171025);border-bottom:1px solid var(--border,#302044)}
#pageInfo{font-size:13px;min-width:90px;text-align:center}
#viewerScroll{width:100%;height:calc(100dvh - 105px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 0 28px}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px;width:max-content;min-width:100%;padding:0 8px}
.page-wrap{background:#fff;box-shadow:0 2px 12px #0004;line-height:0;flex:none;position:relative}
.page-wrap canvas{display:block}
#status{padding:22px 14px;text-align:center;color:var(--muted,#aaa2b9);font-size:14px}
#error{display:none;margin:18px;padding:16px;border:1px solid #a33;border-radius:12px;color:#ffb4b4;background:#78000020;line-height:1.5}
@media(max-width:420px){.viewer-header{gap:5px;padding:8px}.back-btn{padding:8px}.brand{font-size:12px}.download-btn{padding:8px;font-size:11px}.file-title{font-size:11px}}
</style></head>
<body>
<header class="viewer-header">
<button class="back-btn" onclick="history.back()" type="button">← Back</button>
<div class="brand">SSC <span>EDGE</span></div><div class="file-title" id="fileTitle">PDF Viewer</div>
<a class="download-btn" id="downloadBtn" href="#" target="_blank" rel="noopener">↓ Download</a>
</header>
<div class="toolbar"><span id="pageInfo">Loading…</span><button class="tool-btn" id="zoomOut" type="button">−</button><button class="tool-btn" id="zoomIn" type="button">+</button></div>
<div id="status">Loading PDF…</div><div id="error"></div>
<main id="viewerScroll"><div id="pages"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
const p=new URLSearchParams(location.search),url=p.get("file"),title=p.get("title")||"PDF Document";
const status=document.getElementById("status"),errBox=document.getElementById("error"),scroll=document.getElementById("viewerScroll"),pages=document.getElementById("pages");
document.getElementById("fileTitle").textContent=title;
function fail(msg){status.style.display="none";errBox.style.display="block";errBox.textContent=msg;scroll.style.display="none";}
if(!url){fail("PDF link is missing. Return to Study Material and try again.");return;}
document.getElementById("downloadBtn").href=url+(url.includes("?")?"&download":"?download");
if(!window.pdfjsLib){fail("PDF viewer library could not load. Check your internet connection and reload.");return;}
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let doc=null,zoom=1,observer=null,tasks=new Map();
function scaleFor(page){const base=page.getViewport({scale:1});return Math.max(0.3,(Math.min(window.innerWidth-24,900)/base.width)*zoom);}
async function render(n){
if(!doc)return;const wrap=document.getElementById("page-"+n);if(!wrap)return;
const prior=tasks.get(n);if(prior){try{prior.cancel();}catch(e){}}
const page=await doc.getPage(n),vp=page.getViewport({scale:scaleFor(page)}),dpr=Math.min(devicePixelRatio||1,2);
let c=wrap.querySelector("canvas");if(!c){c=document.createElement("canvas");wrap.appendChild(c);}
c.width=Math.floor(vp.width*dpr);c.height=Math.floor(vp.height*dpr);c.style.width=Math.floor(vp.width)+"px";c.style.height=Math.floor(vp.height)+"px";
wrap.style.width=Math.floor(vp.width)+"px";wrap.style.height=Math.floor(vp.height)+"px";
const task=page.render({canvasContext:c.getContext("2d"),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});tasks.set(n,task);
try{await task.promise;}catch(e){if(e?.name!=="RenderingCancelledException")console.warn(e);}
if(tasks.get(n)===task)tasks.delete(n);
}
function observePages(){
if(observer)observer.disconnect();
observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
if(entry.isIntersecting){const n=Number(entry.target.dataset.page);document.getElementById("pageInfo").textContent="Page "+n+" / "+doc.numPages;render(n);}
}),{root:scroll,rootMargin:"650px 0px",threshold:0.01});
document.querySelectorAll(".page-wrap").forEach(el=>observer.observe(el));
}
function build(){
pages.innerHTML="";
for(let n=1;n<=doc.numPages;n++){const el=document.createElement("section");el.className="page-wrap";el.id="page-"+n;el.dataset.page=n;el.style.width="min(92vw,800px)";el.style.height="260px";pages.appendChild(el);}
observePages();render(1);document.getElementById("pageInfo").textContent="Page 1 / "+doc.numPages;
}
async function zoomBy(d){
zoom=Math.max(.65,Math.min(2.5,zoom+d));
const visible=[...document.querySelectorAll(".page-wrap")].filter(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;});
for(const el of visible)await render(Number(el.dataset.page));
}
document.getElementById("zoomIn").onclick=()=>zoomBy(.2);document.getElementById("zoomOut").onclick=()=>zoomBy(-.2);
let resizeTimer;window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!doc)return;document.querySelectorAll(".page-wrap").forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)render(Number(el.dataset.page));});},200);});
pdfjsLib.getDocument({url}).promise.then(d=>{doc=d;status.style.display="none";build();}).catch(e=>fail("Unable to display this PDF. Check the Supabase Storage CORS settings and file URL. Details: "+(e.message||"PDF loading failed")));
})();
</script></body></html>
