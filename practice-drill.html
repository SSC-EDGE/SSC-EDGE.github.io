<style>

:root{
  --pd-bg:#0f0f14;
  --pd-card:#17171f;
  --pd-card2:#20202a;
  --pd-border:#30303c;
  --pd-text:#f7f4fa;
  --pd-muted:#aaa4b3;
  --pd-purple:#9b5cff;
  --pd-purple2:#b487ff;
  --pd-header:#21152f;
  --pd-header2:#17111f;
}

:root[data-theme="light"]{
  --pd-bg:#f7f5fa;
  --pd-card:#ffffff;
  --pd-card2:#f0ebf7;
  --pd-border:#ddd6e8;
  --pd-text:#211d27;
  --pd-muted:#716a7b;
  --pd-purple:#8b45ee;
  --pd-purple2:#7834db;
  --pd-header:#eee3ff;
  --pd-header2:#f8f4ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--pd-bg);
  color:var(--pd-text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:60px;
}

/* =========================
   HEADER — match practice.html
   ========================= */

.pd-head{
  width:100%;
  height:62px;
  display:flex;
  align-items:center;
  padding:0 20px;
  background:linear-gradient(100deg,var(--pd-header),var(--pd-header2)) !important;
  border-bottom:1px solid var(--pd-border);
}

.pd-brand{
  font-size:22px;
  font-weight:900;
  color:var(--pd-text);
}

.pd-brand span{
  color:#b487ff;
}

.pd-sub{display:none;}

/* =========================
   TOP BACK BUTTON
   ========================= */

.pd-top-back{
  max-width:760px;
  margin:0 auto;
  padding:22px 18px 0;
}

.pd-top-back .practice-back{
  display:inline-block;
  color:var(--pd-purple2);
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

/* =========================
   MAIN
   ========================= */

.pd-wrap{
  max-width:760px;
  margin:auto;
  padding:14px 18px 30px;
}

.pd-title{
  font-size:27px;
  line-height:1.15;
  font-weight:900;
  margin:0 0 6px;
}

.pd-muted{
  font-size:13px;
  color:var(--pd-muted);
}

/* subject cards — same look as the exam cards on practice.html */
.pd-subjects{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:22px;
}

.pd-subject-card{
  min-height:104px;
  padding:14px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-align:center;
  flex-direction:column;
  border-radius:15px;
  background:var(--pd-card);
  border:1px solid var(--pd-border);
  cursor:pointer;
}

.pd-subject-card:hover{
  border-color:var(--pd-purple);
}

.pd-subject-icon{
  display:none;
}

.pd-subject-name{
  font-size:15px;
  font-weight:900;
  line-height:1.25;
  color:var(--pd-purple2);
}

/* =========================
   SUBJECT GRID
   ========================= */

.pd-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-top:15px;
}

.pd-card{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:62px;
  border:1px solid var(--pd-border);
  background:var(--pd-card);
  border-radius:12px;
  padding:14px 16px;
  cursor:pointer;
  transition:.15s;
}

.pd-card:hover{
  border-color:var(--pd-purple);
}

.pd-icon{
  font-size:23px;
  margin:0;
  width:30px;
  flex:0 0 30px;
  text-align:center;
}

.pd-card h3{
  font-size:14px;
  margin:0;
  text-transform:uppercase;
}

.pd-card p{display:none;}

/* =========================
   PANEL
   ========================= */

.pd-panel{
  background:var(--pd-card);
  border:1px solid var(--pd-border);
  border-radius:15px;
  padding:14px;
  margin-top:14px;
}

.pd-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.pd-panel h2{
  font-size:16px;
  margin:0;
}

/* =========================
   LIST
   ========================= */

.pd-list{
  display:grid;
  gap:9px;
  margin-top:12px;
}

.pd-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  border:1px solid var(--pd-border);
  background:var(--pd-card2);

  border-radius:11px;
  padding:12px;

  cursor:pointer;

  transition:.15s;
}

.pd-row:hover{
  border-color:var(--pd-purple);
  transform:translateY(-1px);
}

.pd-row strong{
  font-size:16px;
  font-weight:800;
}

.pd-row small{
  display:block;
  color:var(--pd-muted);
  font-size:11px;
  margin-top:5px;
}

/* =========================
   FULL LAVENDER ARROW
   ========================= */

.pd-arrow{
  color:var(--pd-purple2);

  font-size:25px;
  font-weight:900;

  line-height:1;

  flex-shrink:0;

  margin-left:auto;
}

/* =========================
   FOLDER / CHAPTER LINE
   ========================= */

.pd-folder-line{
  display:flex;
  align-items:center;

  gap:11px;

  min-width:0;
  flex:1;
}

.pd-folder-line strong{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================
   FOLDER LOGO
   ========================= */

.pd-folder-logo{
  width:39px;
  height:39px;

  border-radius:11px;

}

  background:rgba(59,130,246,.14);

.pd-folder-logo.revision{

.pd-folder-logo.quiz{

/* =========================

.pd-empty{

/* =========================
   BREADCRUMB
   ========================= */

.pd-breadcrumb{

/* =========================
   TEST

.pd-test{

}

.pd-test-info{

}

.pd-test-meta{

  gap:10px;

.pd-test-title{

}

.pd-test-details{

/* =========================

.pd-actions{

.pd-action{

.pd-action.primary{

}

.pd-action.primary:hover{

.pd-action.secondary{
  background:var(--pd-card);
  color:var(--pd-purple2);

  border:1px solid var(--pd-purple);
}

.pd-action.secondary:hover{
  background:rgba(139,92,246,.10);

/* =========================

.pd-tag{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================================
   SUPABASE
   ================================================== */

const SUPABASE_URL =
  "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   DATA
   ================================================== */

let subjects = [];
let chapters = [];
let folders = [];
let tests = [];

let currentSubject = null;
let currentFolder = null;
let currentChapter = null;


/* ==================================================
   ATTEMPT CACHE
   ================================================== */

const attemptCache = new Map();

let currentUser = null;


/* ==================================================
   ESCAPE HTML
   ================================================== */

function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ==================================================
   SUBJECT ICON
   ================================================== */

function iconFor(n){

  n = String(n).toLowerCase();

  if(n.includes("quant"))
    return "🔢";

  if(
    n.includes("general") ||
    n.includes("aware") ||
    n.includes("gk")
  )
    return "🌍";

  if(n.includes("reason"))
    return "🧠";

  if(n.includes("english"))
    return "📘";

  return "📚";

}


/* ==================================================
   FOLDER LOGO
   ================================================== */

function folderLogo(f){

  if(f.virtualIcon){
    return { icon:f.virtualIcon, cls:"chapter" };
  }

  const type =
    String(
      f.folder_type ||
      f.type ||
      f.name ||
      ""
    ).toUpperCase();

  const name =
    String(
      f.display_name ||
      f.name ||
      ""
    ).toUpperCase();


  if(
    type.includes("CHAPTER") ||
    name.includes("CHAPTER")
  ){

    return {
      icon:"📚",
      cls:"chapter"
    };

  }


  if(
    type.includes("REVISION") ||
    type.includes("BOOST") ||
    name.includes("REVISION") ||
    name.includes("BOOSTER")
  ){

    return {
      icon:"🚀",
      cls:"revision"
    };

  }


  if(
    type.includes("QUIZ") ||
    name.includes("QUIZ")
  ){

    return {
      icon:"🧩",
      cls:"quiz"
    };

  }


  if(
    type.includes("PYQ") ||
    name.includes("PYQ")
  ){

    return {
      icon:"📝",
      cls:"default"
    };

  }


  if(
    type.includes("NEW") ||
    name.includes("NEW MOCK")
  ){

    return {
      icon:"🔥",
      cls:"default"
    };

  }


  return {
    icon:"📁",
    cls:"default"
  };

}


/* ==================================================
   BACK
   ================================================== */

function goBack(){

  if(currentChapter){

    currentChapter = null;

    renderFolderContents();

    return;

  }


  if(currentFolder){

    currentFolder = null;

    renderFolders();

    return;

  }


  if(currentSubject){

    currentSubject = null;
    currentFolder = null;
    currentChapter = null;
    renderSubjects();
    return;

  }

  // At the subject list, Back returns to the main Practice page.
  window.location.href = "practice.html";

}


/* ==================================================
   CURRENT USER
   ================================================== */

async function loadCurrentUser(){

  try{

    const result =
      await db.auth.getUser();

    currentUser =
      result?.data?.user || null;

  }catch(error){

    console.warn(
      "Unable to load current user:",
      error
    );

    currentUser = null;

  }

}


/* ==================================================
   LOAD ATTEMPT DATA
   ================================================== */

async function loadAttemptData(testIds){

  const uniqueIds = [
    ...new Set(
      testIds.map(id => String(id))
    )
  ];


  if(!uniqueIds.length)
    return;


  const missingIds =
    uniqueIds.filter(
      id => !attemptCache.has(id)
    );


  if(!missingIds.length)
    return;


  /*
    User not logged in:
    no database attempts available.
  */

  if(!currentUser){

    missingIds.forEach(id => {

      attemptCache.set(
        id,
        {
          attempts:[],
          completedCount:0,
          state:"new"
        }
      );

    });

    return;

  }


  try{

    const result =
      await db
        .from("test_attempts")
        .select(`
          id,
          user_id,
          mock_test_id,
          started_at,
          completed_at,
          score,
          correct_answers,
          wrong_answers,
          unanswered,
          rank,
          percentile,
          sectional_data
        `)
        .eq(
          "user_id",
          currentUser.id
        )
        .in(
          "mock_test_id",
          missingIds
        )
        .not(
          "completed_at",
          "is",
          null
        )
        .order(
          "completed_at",
          {
            ascending:true
          }
        );


    if(result.error)
      throw result.error;


    const grouped =
      new Map();


    (result.data || [])
      .forEach(attempt => {

        const id =
          String(
            attempt.mock_test_id
          );


        if(!grouped.has(id)){

          grouped.set(
            id,
            []
          );

        }


        grouped
          .get(id)
          .push(attempt);

      });


    missingIds.forEach(id => {

      const attempts =
        grouped.get(id) || [];


      let state =
        attempts.length
          ? "completed"
          : "new";


      /*
        Existing test.html allows
        maximum 4 completed attempts.
      */

      if(attempts.length >= 4){

        state = "completed";

      }


      attemptCache.set(
        id,
        {
          attempts,
          completedCount:
            attempts.length,
          state
        }
      );

    });


  }catch(error){

    console.error(
      "Attempt data error:",
      error
    );


    /*
      Do not break Practice Drill
      if attempt query fails.
    */

    missingIds.forEach(id => {

      attemptCache.set(
        id,
        {
          attempts:[],
          completedCount:0,
          state:"new"
        }
      );

    });

  }

}


/* ==================================================
   GET ATTEMPT STATE
   ================================================== */

function getAttemptState(testId){

  return (
    attemptCache.get(
      String(testId)
    ) ||
    {
      attempts:[],
      completedCount:0,
      state:"new"
    }
  );

}


/* ==================================================
   TEST URL
   ================================================== */

function testUrl(
  testId,
  reattempt = false
){

  let url =
    "test.html?id=" +
    encodeURIComponent(testId);


  if(reattempt){

    url += "&reattempt=1";

  }


  return url;

}


/* ==================================================
   ANALYSIS URL
   SAME FORMAT AS PRACTICE PAGE
   ================================================== */

function analysisUrl(attempt){

  if(!attempt){

    return "analysis.html";

  }


  return (
    "analysis.html" +
    "?attempt_id=" +
    encodeURIComponent(
      attempt.id
    ) +
    "&test_id=" +
    encodeURIComponent(
      attempt.mock_test_id || ""
    )
  );

}


/* ==================================================
   SOLUTIONS URL
   ================================================== */

function solutionsUrl(
  test,
  attempt
){

  let url =
    "solutions.html?test_id=" +
    encodeURIComponent(
      test.id
    );


  if(attempt?.id){

    url +=
      "&attempt_id=" +
      encodeURIComponent(
        attempt.id
      );

  }


  return url;

}


/* ==================================================
   LOAD EVERYTHING
   ================================================== */

async function load(){

  /*
    Load user first so attempt data
    is associated with correct account.
  */

  await loadCurrentUser();


  const [
    s,
    c,
    f,
    t
  ] = await Promise.all([

    db
      .from("subjects")
      .select("*")
      .order("name"),

    db
      .from("chapters")
      .select("*")
      .eq(
        "is_active",
        true
      )
      .order("display_order")
      .order("name"),

    db
      .from("mock_folders")
      .select("*")
      .eq(
        "is_active",
        true
      )
      .order("sort_order")
      .order("name"),

    db
      .from("mock_tests")
      .select("*")
      .eq(
        "is_active",
        true
      )
      .order("sort_order")
      .order(
        "created_at",
        {
          ascending:false
        }
      )

  ]);


  if(
    s.error ||
    c.error ||
    f.error ||
    t.error
  ){

    throw(
      s.error ||
      c.error ||
      f.error ||
      t.error
    );

  }


  // BULK IMPORT is an internal staging subject used by Question Bank,
  // not a student-facing Practice Drill subject.
  subjects =
    (s.data || []).filter(subject =>
      String(subject?.name || "").trim().toLowerCase() !== "bulk import"
    );

  chapters =
    c.data || [];

  folders =
    f.data || [];

  tests =
    t.data || [];

  applyEnglishGroups();


  try{ if(await restoreDrillRoute()) return; }catch(e){ console.error("Route restore failed",e); }

  const sid =
    new URLSearchParams(
      location.search
    ).get("subject_id");


  if(sid){

    openSubject(sid);

  }else{

    renderSubjects();

  }

}


/* ==================================================
   SUBJECT SCREEN
   ================================================== */

function renderSubjects(){

  currentSubject = null;
  currentFolder = null;
  currentChapter = null;

  const backNav = document.getElementById("backNav");
  if(backNav) backNav.style.display = "block";

  const wanted = [
    { label:"Quantitative Aptitude", icon:"🔢", keys:["quantitative aptitude","quant aptitude","quant"] },
    { label:"General Awareness", icon:"🌍", keys:["general awareness","general knowledge","gk"] },
    { label:"Reasoning", icon:"🧠", keys:["reasoning","general intelligence"] },
    { label:"English", icon:"📘", keys:["english","english language"] },
    { label:"Computer Knowledge", icon:"💻", keys:["computer"] }
  ];

  const orderedSubjects = wanted.map(item => {
    const found = subjects.find(subject => {
      const name = String(subject?.name || "").trim().toLowerCase();
      return item.keys.some(key => name === key || name.includes(key));
    });
    return { ...item, subject:found };
  }).filter(item => item.subject);

  document.getElementById("app").innerHTML = `
    <div class="pd-title">Practice Drill</div>
    <div class="pd-muted">Choose a subject to continue practice</div>
    <div class="pd-subjects">
      ${orderedSubjects.map(item => `
        <div class="pd-subject-card" onclick="openSubject('${item.subject.id}')">
          <div class="pd-subject-name">${esc(item.label)}</div>

}


/* ==================================================
   OPEN SUBJECT
   ================================================== */

function openSubject(id){

  currentSubject =
    subjects.find(
      s =>
        String(s.id) ===
        String(id)
    );


  if(!currentSubject){

    renderSubjects();

    return;

  }


  currentFolder = null;
  currentChapter = null;

  renderFolders();

}


/* ==================================================
   ENGLISH → Grammar / Vocabulary / Reading Comprehension
   English has 3 fixed folders. Every chapter (Antonyms, Voice,
   Cloze Test …) is placed in one of them automatically and keeps
   its own folder of sets inside. Edit the keyword lists to move a chapter.
   ================================================== */

const ENGLISH_GROUPS = [
  { key:"grammar",    name:"Grammar",               icon:"✍️", words:[] },
  { key:"vocabulary", name:"Vocabulary",            icon:"📖", words:["antonym","synonym","homonym","idiom","phrase","phrasal","one word","spelling","vocab","word"] },
  { key:"reading",    name:"Reading Comprehension", icon:"", words:["comprehension","cloze","passage","para jumble","parajumble","sentence rearrangement","sentence rearrange","pqrs"] }
];

function englishGroupOf(name){
  const n = String(name || "").toLowerCase();
  for(const g of [ENGLISH_GROUPS[2], ENGLISH_GROUPS[1]]){
    if(g.words.some(w => n.includes(w))) return g;
  }
  return ENGLISH_GROUPS[0];
}

function applyEnglishGroups(){

  subjects.filter(s => /english/i.test(String(s.name||""))).forEach(sub => {

    const roots = folders.filter(f =>
      String(f.subject_id || "") === String(sub.id) &&
      !f.parent_id &&
      String(f.folder_type || "").toUpperCase().includes("CHAPTER")
    );

    if(!roots.length) return;

    const rootIds = new Set(roots.map(r => String(r.id)));
    const chapterFolders = folders.filter(f => rootIds.has(String(f.parent_id || "")));

    folders = folders.filter(f => !rootIds.has(String(f.id)));

    ENGLISH_GROUPS.forEach((g,i) => {

      const virtualId = "grp-" + g.key + "-" + sub.id;

      folders.push({
        id:virtualId,
        subject_id:sub.id,
        exam_id:roots[0].exam_id,
        parent_id:null,
        name:g.name,
        display_name:g.name,
        folder_type:"CHAPTER",
        is_active:true,
        sort_order:i + 1,
        virtualIcon:g.icon,
        virtual:true
      });

      chapterFolders
        .filter(c => englishGroupOf(c.display_name || c.name) === g)
        .forEach(c => {
          const chapterName = String(c.display_name || c.name || "").toLowerCase();
          if (chapterName.includes("mc sentence rearrangement") ||
              chapterName.includes("mc sentence rearrange")) {
            c.display_name = "Para Jumble [PQRS]";
          }
          c.parent_id = virtualId;
        });

    });

  });

}

/* ==================================================
   SUBJECT FOLDERS
   ================================================== */

function subjectFolders(){

  return folders.filter(
    f =>
      String(
        f.subject_id || ""
      ) ===
      String(
        currentSubject.id
      )
      &&
      !f.parent_id
  );

}


/* ==================================================
   RENDER FOLDERS

function renderFolders(){

/* ==================================================
   FOLDER HINT
   ================================================== */

function folderHint(f){

  if(f.virtual){
    const n = folders.filter(c => String(c.parent_id || "") === String(f.id)).length;
    return n + (n === 1 ? " topic" : " topics");
  }

  const x =
    String(
      f.folder_type || ""
    ).toUpperCase();


  if(x.includes("CHAPTER"))
    return "Chapter-wise practice";


  if(x.includes("QUIZ"))
    return "Topic quizzes";


  if(
    x.includes("REVISION") ||
    x.includes("BOOST")
  )
    return "Revision booster";


  return "Practice tests";

}


/* ==================================================
   OPEN FOLDER
   ================================================== */

function openFolder(id){

  currentFolder =
    folders.find(
      f =>
        String(f.id) ===
        String(id)
    );


  if(!currentFolder)
    return;


  currentChapter = null;

  renderFolderContents();

}


/* ==================================================
   CHILD FOLDERS
   ================================================== */

function childFolders(){

  return folders

    .filter(
      f =>
        String(
          f.parent_id || ""
        ) ===
        String(
          currentFolder.id
        )
        &&
        f.is_active !== false
    )

    .sort(
      (a,b) =>
        (a.sort_order || 0) -
        (b.sort_order || 0)
    );

}


/* ==================================================
   FOLDER TESTS
   ================================================== */

function folderTests(fid){

  return tests.filter(
    t =>
      String(
        t.folder_id || ""
      ) ===
      String(fid)
  );

}


/* ==================================================
   RENDER FOLDER CONTENTS
   ================================================== */

async function renderFolderContents(){

  const backNav = document.getElementById("backNav");
  if(backNav) backNav.style.display = "block";

  const children =
    childFolders();

  const direct =
    folderTests(
      currentFolder.id
    );


  const isChapter =
    String(
      currentFolder.folder_type || ""
    )
    .toUpperCase()
    .includes("CHAPTER");


  /*
    Load attempt data for direct tests
    and child folder tests.
  */

  const childTestIds = [];

  children.forEach(c => {

    folderTests(c.id)
      .forEach(t =>
        childTestIds.push(t.id)
      );

  });


  direct.forEach(t =>
    childTestIds.push(t.id)
  );


  await loadAttemptData(
    childTestIds
  );


  let html = `

    <div class="pd-breadcrumb">

      Practice Drill ›
      ${esc(currentSubject.name)}
      ›
      ${esc(
        currentFolder.display_name ||
        currentFolder.name
      )}

    </div>

    <div class="pd-title">

      ${esc(
        currentFolder.display_name ||
        currentFolder.name
      )}

    </div>

  `;


  /* =========================
     CHILD CHAPTERS / TOPICS
     ========================= */

  if(children.length){

    html += `

      <div class="pd-panel">

        <div class="pd-panel-head">

          <h2>
            ${
              isChapter
                ? "Chapters"
                : "Topics"
            }
          </h2>

        </div>

        <div class="pd-list">

          ${
            children.map(c => `

              <div
                class="pd-row"
                onclick="openChapter('${c.id}')"
              >

                <div class="pd-folder-line">

                  <div
                    class="
                      pd-folder-logo
                      ${
                        isChapter
                          ? "chapter"
                          : "default"
                      }
                    "
                  >

                    ${
                      String(
                        c.display_name ||
                        c.name ||
                        "F"
                      )
                      .trim()
                      .charAt(0)
                      .toUpperCase()
                    }

                  </div>

                  <strong>
                    ${esc(
                      c.display_name ||
                      c.name
                    )}
                  </strong>

                </div>

                <div class="pd-arrow">
                  →
                </div>

              </div>

            `).join("")
          }

        </div>

      </div>

    `;

  }


  /* =========================
     DIRECT TESTS
     ========================= */

  if(direct.length){

    html +=
      renderTestList(
        direct
      );

  }


  if(
    !children.length &&
    !direct.length
  ){

    html += `

      <div class="pd-panel">

        <div class="pd-empty">
          No practice tests
          available yet.
        </div>

      </div>

    `;

  }


  document.getElementById(
    "app"
  ).innerHTML = html;

}


/* ==================================================
   OPEN CHAPTER
   ================================================== */

async function openChapter(id){

  const backNav = document.getElementById("backNav");
  if(backNav) backNav.style.display = "block";

  currentChapter =
    folders.find(
      f =>
        String(f.id) ===
        String(id)
    );


  if(!currentChapter)
    return;


  const ts =
    folderTests(
      currentChapter.id
    );


  await loadAttemptData(
    ts.map(t => t.id)
  );


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="pd-breadcrumb">

      Practice Drill ›
      ${esc(currentSubject.name)}
      ›
      ${esc(
        currentFolder.display_name ||
        currentFolder.name
      )}
      ›
      ${esc(
        currentChapter.display_name ||
        currentChapter.name
      )}

    </div>

    <div class="pd-title">

      ${esc(
        currentChapter.display_name ||
        currentChapter.name
      )}

    </div>

    ${
      renderTestList(ts)
      ||
      `
        <div class="pd-panel">

          <div class="pd-empty">
            No tests in this
            chapter yet.
          </div>

        </div>
      `
    }

  `;

}


/* ==================================================
   TEST LIST
   ================================================== */

function renderTestList(ts){

  if(!ts.length)
    return "";


  return `

    <div class="pd-panel">

      <div class="pd-panel-head">

        <h2>
          Available Tests
        </h2>

      </div>

      <div class="pd-list">

        ${
          ts.map(t => {

            const status =
              getAttemptState(
                t.id
              );


            const completedCount =
              status.completedCount;


            /*
              Latest attempt.
              Data is ordered oldest → newest,
              so last item is latest.
            */

            const latest =
              status.attempts.length
                ? status.attempts[
                    status.attempts.length - 1
                  ]
                : null;


            let actions = "";


            /* =========================
               NO ATTEMPT
               ========================= */

            if(
              completedCount === 0
            ){

              actions = `

                <a
                  class="pd-action primary"
                  href="${testUrl(
                    t.id,
                    false
                  )}"
                >
                  START
                </a>

              `;

            }


            /* =========================
               ATTEMPTS EXIST
               ========================= */

            else{

              /*
                Maximum 4 attempts.
              */

              if(
                completedCount < 4
              ){

                actions += `

                  <a
                    class="
                      pd-action
                      primary
                    "
                    href="${testUrl(
                      t.id,
                      true
                    )}"
                  >
                    RE-ATTEMPT
                  </a>

                `;

              }


              /*
                Solutions + Analysis
                always use latest completed
                attempt.
              */

              if(latest){

                actions += `

                  <a
                    class="
                      pd-action
                      secondary
                    "
                    href="${solutionsUrl(
                      t,
                      latest
                    )}"
                  >
                    SOLUTIONS
                  </a>

                  <a
                    class="
                      pd-action
                      secondary
                    "
                    href="${analysisUrl(
                      latest
                    )}"
                  >
                    ANALYSIS
                  </a>

                `;

              }

            }


            return `

              <div
                class="pd-row"
                style="cursor:default"
              >

                <div
                  class="pd-test-card"
                >

                  <div
                    class="pd-test-title"
                  >
                    ${esc(
                      t.title ||
                      "Practice Test"
                    )}
                  </div>


                  <div
                    class="pd-test-details"
                  >

                    ${esc(
                      t.description ||
                      "Practice Test"
                    )}

                    <br>

                    ⏱
                    ${t.duration_minutes || 0}
                    min

                    &nbsp; · &nbsp;

                    📝
                    ${t.total_questions || 0}
                    questions

                  </div>


                  ${
                    completedCount
                      ? `

                        <div
                          class="
                            pd-attempt-info
                          "
                        >
                          ${completedCount}
                          / 4 attempts completed
                        </div>

                      `
                      : ""
                  }


                  <div
                    class="pd-actions"
                  >
                    ${actions}
                  </div>

                </div>

              </div>

            `;

          }).join("")
        }

      </div>

    </div>

  `;

}


/* ==================================================
   OPEN TEST
   ================================================== */

function openTest(id){

  location.href =
    "test.html?id=" +
    encodeURIComponent(id);

}



/* ==================================================
   CLEAN URLS  (/practice/drill/quantitative-aptitude/chapter-wise/percentage)
   Works for any subject / folder / chapter you add later:
   the link is built from its name automatically.
   ================================================== */

function slugify(v){
  return String(v||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function folderSlug(f){ return slugify(f.display_name || f.name); }

function syncUrl(){
  try{
    let path = "/practice/drill";
    if(currentSubject){
      path += "/" + slugify(currentSubject.name);
      if(currentFolder){
        path += "/" + folderSlug(currentFolder);
        if(currentChapter) path += "/" + folderSlug(currentChapter);
      }
    }
    if(location.pathname !== path) history.replaceState(null,"",path);
  }catch(e){}
}

(function wrapNav(){
  ["renderSubjects","renderFolders","renderFolderContents","openChapter"].forEach(name=>{
    const orig = window[name];
    if(typeof orig !== "function") return;
    window[name] = async function(){
      const r = await orig.apply(this,arguments);
      syncUrl();
      return r;
    };
  });
})();

async function restoreDrillRoute(){
  const m = location.pathname.match(/^\/practice\/drill(?:\/([^\/]+))?(?:\/([^\/]+))?(?:\/([^\/]+))?\/?$/i);
  if(!m || !m[1]) return false;
  const subj = subjects.find(s=>slugify(s.name)===m[1])
    || subjects.find(s=>slugify(s.name).includes(m[1]) || m[1].includes(slugify(s.name)));
  if(!subj) return false;
  openSubject(subj.id);
  if(!m[2]) return true;
  const folder = subjectFolders().find(f=>folderSlug(f)===m[2]);
  if(!folder) return true;
  openFolder(folder.id);
  if(!m[3]) return true;
  const chapter = childFolders().find(f=>folderSlug(f)===m[3]);
  if(chapter) await openChapter(chapter.id);
  return true;
}
