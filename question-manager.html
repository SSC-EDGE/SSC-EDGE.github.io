<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>document.documentElement.dataset.theme=localStorage.getItem("ssc-edge-theme")||"dark";</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#08050e;--c:#171025;--c2:#251344;--bd:#302044;--t:#fff;--m:#aaa2b9;--p:#7c3aed;--p2:#a66bff}:root[data-theme=light]{--b:#f6f3fb;--c:#fff;--c2:#f1eafa;--bd:#ddd1ef;--t:#211832;--m:#756985;--p:#6d35d4;--p2:#8149e8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Arial,sans-serif}header{position:sticky;top:0;background:var(--c);border-bottom:1px solid var(--bd);padding:12px 15px;display:flex;gap:10px;align-items:center;z-index:5}header a{color:var(--t);text-decoration:none}.brand{font-weight:800;font-size:17px}.brand span{color:var(--p2)}.sub{margin-left:auto;color:var(--m);font-size:12px}main{max-width:1100px;margin:auto;padding:14px}.panel{background:var(--c);border:1px solid var(--bd);border-radius:13px;padding:14px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--m);font-weight:bold}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--c2);color:var(--t)}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;font-size:12px;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:var(--c2);border:1px solid var(--bd);color:var(--t)}.danger{background:#ef444422;border:1px solid #ef444455;color:#f87171}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{display:grid;gap:8px}.row{padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--c2)}.rowhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.muted{color:var(--m);font-size:12px;line-height:1.5}.msg{margin:10px 0;padding:10px;border-radius:8px;background:var(--c2);color:var(--p2);white-space:pre-wrap}.question{padding:11px;margin:8px 0;border:1px solid var(--bd);border-radius:9px;background:var(--c2)}.qtitle{line-height:1.5;overflow-wrap:anywhere}.options{font-size:12px;color:var(--m);line-height:1.7;margin-top:7px}.hidden{display:none!important}@media(max-width:600px){main{padding:9px}.sub{display:none}}</style><title>Question Manager · SSC EDGE</title></head><body><header><a href="questions.html">‹</a><div class="brand">SSC <span>EDGE</span></div><div class="sub">Question Manager</div></header><main><section class="panel"><h3>Exam → Mock → Sectional → Questions</h3><div class="grid"><div class="field"><label>Exam</label><select id="exam" onchange="loadMocks()"><option value="">Select Exam</option></select></div><div class="field"><label>Mock</label><select id="mock" onchange="loadSections()"><option value="">Select Mock</option></select></div><div class="field"><label>Sectional Mock / Section</label><select id="section" onchange="loadQuestions()"><option value="">Select Section</option></select></div></div><div class="actions"><button class="btn secondary" onclick="loadQuestions()">Refresh Questions</button></div><div id="msg" class="msg">Loading…</div></section><section class="panel"><div class="rowhead"><h3>Assigned Questions</h3><span class="muted" id="count"></span></div><div id="list" class="list"></div></section></main><script>const SUPABASE_URL="https://dvvyoygahzzbnpqrfhen.supabase.co";const SUPABASE_KEY="sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function msg(t){$('msg').textContent=t;}function nav(){return `<div class="actions"><a class="btn secondary" href="questions.html">Question Bank</a><a class="btn secondary" href="mock-manager.html">Mock Manager</a><a class="btn secondary" href="chapter-mock-manager.html">Chapter-wise Mocks</a><a class="btn secondary" href="question-shift-manager.html">Shift Manager</a></div>`}</script><script>let exams=[],mocks=[],sections=[],assignments=[],questions=[],options=[];async function init(){let [e,m]=await Promise.all([db.from('exams').select('*').order('name'),db.from('mock_tests').select('*').order('created_at',{ascending:false})]);if(e.error||m.error){msg((e.error||m.error).message);return}exams=e.data||[];mocks=m.data||[];$('exam').innerHTML='<option value="">Select Exam</option>'+exams.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.title)}</option>`).join('');const params=new URLSearchParams(location.search);if(params.get('exam_id'))$('exam').value=params.get('exam_id');await loadMocks();if(params.get('test_id')){$('mock').value=params.get('test_id');await loadSections()}if(params.get('section_id')){$('section').value=params.get('section_id');await loadQuestions()}}async function loadMocks(){let eid=$('exam').value,arr=mocks.filter(x=>!eid||String(x.exam_id)===eid);$('mock').innerHTML='<option value="">Select Mock</option>'+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.title||x.name||'Untitled mock')}</option>`).join('');$('section').innerHTML='<option value="">Select Section</option>';$('list').innerHTML='';if($('mock').value)await loadSections()}async function loadSections(){let id=$('mock').value;if(!id){$('section').innerHTML='<option value="">Select Section</option>';return}let r=await db.from('mock_test_sections').select('*').eq('mock_test_id',id).order('section_order');if(r.error){msg(r.error.message);return}sections=r.data||[];$('section').innerHTML='<option value="">All sections / choose section</option>'+sections.map(s=>`<option value="${esc(s.id)}">${esc(s.section_name||s.name||s.title||'Section')}</option>`).join('');await loadQuestions()}async function loadQuestions(){let mid=$('mock').value,sid=$('section').value;if(!mid){$('list').innerHTML='';return}let q=db.from('mock_test_questions').select('id,mock_test_id,question_id,section_id,question_order').eq('mock_test_id',mid).order('question_order');if(sid)q=q.eq('section_id',sid);let a=await q;if(a.error){msg(a.error.message);return}assignments=a.data||[];let ids=[...new Set(assignments.map(x=>x.question_id))];if(!ids.length){$('list').innerHTML='<div class="muted">No assigned questions in this selection.</div>';$('count').textContent='0 questions';msg('Ready');return}let [qr,or]=await Promise.all([db.from('questions').select('id,question_text,question_text_hi,explanation,subject_id,chapter_id').in('id',ids),db.from('question_options').select('*').in('question_id',ids).order('option_label')]);if(qr.error||or.error){msg((qr.error||or.error).message);return}questions=qr.data||[];options=or.data||[];$('count').textContent=assignments.length+' assignments';$('list').innerHTML=assignments.map((a,i)=>{let q=questions.find(x=>String(x.id)===String(a.question_id))||{};let os=options.filter(o=>String(o.question_id)===String(a.question_id));return `<div class="question"><div class="qtitle"><b>Q${i+1}.</b> ${esc(q.question_text||q.question_text_hi||'Question unavailable')}<br><span class="muted">${esc(q.question_text_hi||'')}</span></div><div class="options">${os.map(o=>`${esc(o.option_label)}. ${esc(o.option_text||'')}${o.option_text_hi?' / '+esc(o.option_text_hi):''}${o.is_correct?' ✓':''}`).join('<br>')}</div><label class="muted" for="exp-${esc(a.id)}">Explanation</label><textarea id="exp-${esc(a.id)}" rows="2" style="width:100%;margin-top:5px;background:var(--c);color:var(--t);border:1px solid var(--bd);border-radius:8px;padding:9px">${esc(q.explanation||'')}</textarea><div class="actions"><button class="btn primary" onclick="saveExplanation('${esc(q.id)}','exp-${esc(a.id)}')">Save Explanation</button><button class="btn secondary" onclick="location.href='create-questions.html?edit=${encodeURIComponent(q.id)}'">Edit Question</button><button class="btn danger" onclick="removeAssignment('${esc(a.id)}')">Remove from Mock</button></div></div>`}).join('');msg('Ready — removing from mock does not delete the original question.')}async function saveExplanation(id,field){let r=await db.from('questions').update({explanation:$(field).value.trim()||null}).eq('id',id);msg(r.error?r.error.message:'Explanation saved.');}async function removeAssignment(id){if(!confirm('Remove this question from the selected mock/section only? Original Question Bank question stays safe.'))return;let r=await db.from('mock_test_questions').delete().eq('id',id);if(r.error){msg(r.error.message);return}await loadQuestions()}init();</script></body></html>
