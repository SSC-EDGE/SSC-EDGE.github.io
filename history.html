<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Test History - SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "light";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.simple-header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:var(--header);
  border-bottom:1px solid var(--border);
}

.simple-header h2{
  margin:0;
  font-size:20px;
}

/* EDGE = LAVENDER */
.simple-header h2{
  color:var(--text);
}

.simple-header h2::first-letter{
  color:var(--text);
}

.page-container{
  max-width:600px;
  margin:auto;
  padding:22px 16px 100px;
}

.page-title{
  margin:0;
  font-size:24px;
}

.page-subtitle{
  margin:6px 0 22px;
  color:var(--muted);
  font-size:14px;
}

.history-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.test-name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:5px;
}

.test-date{
  color:var(--muted);
  font-size:12px;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:15px;
}

.stat{
  background:var(--card2);
  border-radius:9px;
  padding:9px 4px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:15px;
}

.stat span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.score{
  font-size:14px;
  margin-bottom:12px;
}

.buttons{
  display:flex;
  gap:8px;
}

.btn{
  flex:1;
  padding:10px 6px;
  border-radius:9px;
  text-align:center;
  text-decoration:none;
  font-size:12px;
  cursor:pointer;
}

.analysis-btn{
  background:var(--purple);
  color:white;
}

.solution-btn{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:64px;
  background:var(--header);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom-nav a{
  text-decoration:none;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

.bottom-nav a.active{
  color:var(--purple2);
}

.nav-icon{
  font-size:20px;
  display:block;
  margin-bottom:2px;
}

@media(max-width:380px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}


/* ===== Back button (mobile + desktop) ===== */
.ssc-back{display:inline-block; margin:0 0 14px; font-size:14px; font-weight:800; color:var(--purple,#8b45ee); text-decoration:none;}
.d-top,.d-foot{display:none;}
@media(min-width:960px){
.d-top{display:block; position:sticky; top:0; z-index:100; width:100%; flex-shrink:0;
  --d-bg:linear-gradient(100deg,#21152f,#17111f); --d-text:#f7f4fa; --d-muted:#aaa4b3; --d-line:#30303c;}
:root[data-theme="light"] .d-top{--d-bg:linear-gradient(100deg,#eee3ff,#f8f4ff); --d-text:#211d27; --d-muted:#716a7b; --d-line:#ddd6e8;}
.d-head{height:96px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; background:var(--d-bg); padding:0 max(32px, calc((100% - max(1200px, 83.333%)) / 2));}
.d-brand{font-size:44px; line-height:1; font-weight:900; color:var(--d-text);}
.d-brand span{color:#9b5cff;}
.d-tag{margin-top:6px; font-size:17px; font-weight:700; line-height:1; color:var(--d-muted);}
.d-nav{height:54px; display:flex; align-items:stretch; gap:28px; background:var(--d-bg); border-bottom:1px solid var(--d-line);
  padding:0 max(16px, calc((100% - max(1200px, 83.333%)) / 2 - 16px));}
.d-nav a{position:relative; display:flex; align-items:center; padding:0 16px; text-decoration:none; color:var(--d-muted);
  font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap;}
.d-nav a::after{content:""; position:absolute; left:16px; right:16px; bottom:0; height:3px; border-radius:3px 3px 0 0;}
.d-nav a.active,.d-nav a:hover{color:#9b5cff;}
.d-nav a.active::after{background:#9b5cff;}
.d-foot{display:block; flex-shrink:0; text-align:center; padding:32px 20px; border-top:1px solid var(--border,var(--p-border,#ddd6e8));}
.d-foot h2{margin:0; font-size:19px; font-weight:800;}
.d-foot h2 span{color:#9b5cff;}
.d-foot p{margin:6px 0 0; font-size:11px; color:var(--muted,var(--p-muted,#716a7b));}
body{display:flex; flex-direction:column; min-height:100vh; padding:0 !important;}
.ssc-back{align-self:flex-start; font-size:15px; margin-bottom:20px;}
}
:where(:root[data-theme="light"]){--bg:#f7f5fa;--card:#fff;--card2:#f0ebf7;--border:#ddd6e8;--text:#211d27;--muted:#716a7b;--header:#f1e9ff;--purple:#8b45ee;--purple2:#7834db;}
@media(min-width:960px){
.simple-header,.bottom-nav{display:none;}
.page-container{flex:1 0 auto; width:100%; max-width:max(1264px, calc(83.333% + 64px)); margin:0 auto; padding:36px 32px 56px;}
.page-title{font-size:38px;}
.page-subtitle{font-size:16px; margin:8px 0 28px;}
#historyList{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px;}
#historyList > .empty,#historyList > .loading{grid-column:1/-1;}
.history-card{margin:0; padding:26px; display:flex; flex-direction:column;}
.test-name{font-size:20px;}
.test-date{font-size:14px; margin-bottom:20px;}
.stats{gap:12px; margin:auto 0 20px;}
.stat{padding:15px 6px;}
.stat strong{font-size:22px;}
.stat span{font-size:12.5px; margin-top:6px;}
.btn{font-size:15px; font-weight:700; padding:13px 8px;}
.empty{font-size:16px; padding:70px 20px;}
}

</style>
</head>

<body>

<div class="d-top">
  <div class="d-head">
    <div class="d-brand">SSC <span>EDGE</span></div>
    <div class="d-tag">Learn • Practice • Improve</div>
  </div>
  <nav class="d-nav">
    <a href="home.html">Home</a>
    <a href="study.html">Study</a>
    <a href="practice.html">Practice</a>
    <a href="typing.html">Typing</a>
    <a href="profile.html" class="active">Profile</a>
  </nav>
</div>


<header class="simple-header">
  <h2>
    SSC <span style="color:#c4a7ff;">EDGE</span>
  </h2>
</header>


<main class="page-container">

  <a class="ssc-back" href="profile.html" onclick="return sscBack()">← Back</a>

  <h1 class="page-title">
    Test History
  </h1>

  <p class="page-subtitle">
    View your attempted tests and results
  </p>

  <div id="historyList">

    <div class="loading">
      Loading test history...
    </div>

  </div>

</main>


<nav class="bottom-nav">

  <a href="home.html">

  <a href="study.html">

  </a>

  </a>

</nav>


<footer class="d-foot">
  <h2>SSC <span>EDGE</span></h2>
  <p>Learn • Practice • Improve</p>
</footer>

<script>
/* one step back inside the site; otherwise follow the link */
function sscBack(){
  try{
    const r = document.referrer && new URL(document.referrer);
    if(r && history.length > 1 && r.origin === location.origin &&
       !/(^|\/)(index(\.html)?)?$/.test(r.pathname)){
      history.back();
      return false;
    }
  }catch(e){}
  return true;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

  if(!date)return "Date unavailable";

  const d =
    new Date(date);

  if(isNaN(d.getTime()))
    return "Date unavailable";

  return d.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

  const list =
    document.getElementById("historyList");


  /* =========================
     GUEST CHECK
  ========================= */

  const isGuest =
    localStorage.getItem("ssc-edge-guest")
    === "true";


  if(isGuest){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">📝</div>

        <strong>Login required</strong>

        <p>
          Login to save and view your
          test history across devices.
        </p>

      </div>

    `;

    return;
  }


  /* =========================
     GET USER
  ========================= */

  const {
    data:{user},
    error:userError
  } =
  await supabaseClient.auth.getUser();


  if(userError || !user){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">🔐</div>

        <strong>Please login</strong>

        <p>
          Login to view your test history.
        </p>

      </div>

    `;

    return;
  }


  /* =========================
     GET COMPLETED ATTEMPTS
  ========================= */

  const {
    data:attempts,
    error:attemptError
  } =
  await supabaseClient
    .from("test_attempts")
    .select(`
      id,
      mock_test_id,
      started_at,
      completed_at,
      score,
      correct_answers,
      wrong_answers,
      unanswered
    `)
    .eq("user_id",user.id)
    .not("completed_at","is",null)
    .order("completed_at",{ascending:false});


  if(attemptError){

    console.error(attemptError);

    list.innerHTML = `

      <div class="empty">

        Unable to load test history.

      </div>

    `;

    return;
  }


  if(!attempts || attempts.length === 0){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">📝</div>

        <strong>No test attempts yet</strong>

        <p>
          Your completed mock tests will
          appear here.
        </p>

      </div>

    `;

    return;
  }


  /* =========================
     GET TEST IDs
  ========================= */

  const testIds =
    [
      ...new Set(
        attempts
          .map(a => a.mock_test_id)
          .filter(Boolean)
      )
    ];


  let tests = [];


  if(testIds.length){

    const {
      data,
      error
    } =
    await supabaseClient
      .from("mock_tests")
      .select("id,title")
      .in("id",testIds);


    if(!error && data){

      tests = data;

    }

  }


  /* =========================
     TEST NAME MAP
  ========================= */

  const testMap = {};

  tests.forEach(test=>{

    testMap[String(test.id)] =
      test.title;

  });


  /* =========================
     RENDER
  ========================= */

  list.innerHTML =
    attempts.map(attempt=>{

      const testName =
        testMap[
          String(attempt.mock_test_id)
        ]
        || "Mock Test";


      const testId =
        String(attempt.mock_test_id || "");

      const attemptId =
        String(attempt.id || "");


      return `

        <div class="history-card">

          <div class="test-name">
            ${escapeHtml(testName)}
          </div>

          <div class="test-date">
            ${formatDate(
              attempt.completed_at
              || attempt.started_at
            )}
          </div>


          <div class="stats">

            <div class="stat">
              <strong>
                ${attempt.correct_answers ?? 0}
              </strong>
              <span>Correct</span>
            </div>

            <div class="stat">
              <strong>
                ${attempt.wrong_answers ?? 0}
              </strong>
              <span>Wrong</span>
            </div>

            <div class="stat">
              <strong>
                ${attempt.unanswered ?? 0}
              </strong>
              <span>Unanswered</span>
            </div>

            <div class="stat">
              <strong>
                ${attempt.score ?? 0}
              </strong>
              <span>Score</span>
            </div>

          </div>


          <div class="buttons">

            <a
              class="btn analysis-btn"
              href="analysis.html?test_id=${encodeURIComponent(testId)}&attempt_id=${encodeURIComponent(attemptId)}">
              View Analysis
            </a>

            <a
              class="btn solution-btn"
              href="solutions.html?test_id=${encodeURIComponent(testId)}&attempt_id=${encodeURIComponent(attemptId)}">
              View Solutions
            </a>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   START
========================= */

loadHistory();

</script>

</body>
