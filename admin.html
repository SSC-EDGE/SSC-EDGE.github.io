<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SSC EDGE Admin</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("ssc-edge-theme")||"dark";</script>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.admin-page{max-width:1100px;margin:auto;min-height:100vh;padding:22px 16px 80px}
.admin-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.admin-header h1{margin:0;font-size:27px}.admin-header p{margin:5px 0 0;color:var(--muted)}
.admin-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.login-box{max-width:420px;margin:60px auto}
.login-box input{width:100%;box-sizing:border-box;margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px}
.login-btn,.logout-btn{margin-top:14px;padding:12px 16px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.login-btn{width:100%}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text);margin:0}
.error{color:#ff6b6b;margin-top:12px;font-size:14px}
#adminPanel{display:none}
#q{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;margin:6px 0 4px}
.sec{margin:26px 2px 10px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tool{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.tool:hover{border-color:var(--purple)}
.tool b{display:block;font-size:15px;margin-bottom:5px}.tool span{color:var(--muted);font-size:12.5px;line-height:1.4}
.hide{display:none!important}
</style></head><body>
<div id="loginScreen" class="login-box admin-card">
  <h1>SSC EDGE Admin</h1><p>Admin Login</p>
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button class="login-btn" onclick="login()">Login</button>
  <div id="loginError" class="error"></div>
</div>

<main id="adminPanel" class="admin-page">
  <div class="admin-header">
    <div><h1>SSC EDGE Admin</h1><p>Everything you manage, in one place</p></div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  <input id="q" placeholder="Search tools… (e.g. bulk, video, mock)" oninput="filter()">
  <div id="tools"></div>
</main>

<script src="admin-nav.js" data-home></script>
<script>
const db=supabase.createClient("https://dvvyoygahzzbnpqrfhen.supabase.co","sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s");
const $=id=>document.getElementById(id);
function render(){
  $("tools").innerHTML=ADMIN_TOOLS.map(g=>`<div class="sec" data-sec>${g.i} ${g.g}</div><div class="grid" data-grid>`+
    g.items.map(t=>`<a class="tool" href="${t[0]}" data-k="${(t[2]+" "+t[3]).toLowerCase()}"><b>${t[1]} ${t[2]}</b><span>${t[3]}</span></a>`).join("")+`</div>`).join("");
}
function filter(){
  const v=$("q").value.trim().toLowerCase();
  document.querySelectorAll(".tool").forEach(a=>a.classList.toggle("hide",!!v&&!a.dataset.k.includes(v)));
  document.querySelectorAll("[data-grid]").forEach(g=>{
    const any=[...g.children].some(a=>!a.classList.contains("hide"));
    g.classList.toggle("hide",!any);g.previousElementSibling.classList.toggle("hide",!any);
  });
}
function showLogin(msg){$("loginScreen").style.display="block";$("adminPanel").style.display="none";if(msg)$("loginError").textContent=msg}
async function login(){
  const email=$("email").value.trim(),password=$("password").value;
  $("loginError").textContent="";
  if(!email||!password){$("loginError").textContent="Please enter email and password.";return}
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){$("loginError").textContent=error.message;return}
  await checkAdmin();
}
async function checkAdmin(){
  const {data:{user}}=await db.auth.getUser();
  if(!user)return showLogin();
  const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
  if(error)return showLogin("Unable to verify admin access.");
  if(!data){await db.auth.signOut();return showLogin("Access denied. Admin account required.")}
  $("loginScreen").style.display="none";$("adminPanel").style.display="block";
}
async function logout(){await db.auth.signOut();showLogin()}
render();checkAdmin();
</script></body></html>
