<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eduquity Typing Test | SSC EDGE</title>
<style>
*{box-sizing:border-box}
:root{--blue:#355f8e;--paper:#f0f0f0;--ink:#111;--green:#c8ff9a}
html,body{margin:0;min-height:100%;background:var(--paper);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.topbar{height:52px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:11px;padding:0 10px;position:sticky;top:0;z-index:5;font-family:Arial,sans-serif;min-width:0}
.tool{height:30px;min-width:34px;border:1px solid #bbb;border-radius:5px;background:#fff;color:#111;font-size:21px;font-weight:700;line-height:1;padding:0 7px;flex:0 0 auto}
.brand{font:700 17px Arial,sans-serif;white-space:nowrap;margin-left:2px;flex:0 0 auto;letter-spacing:.25px}.brand span{color:#c6a0ff}
.exam-name,.mock-name{font:700 17px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;border-left:1px solid #ffffff66;max-width:20%;min-width:0;letter-spacing:.15px}
.mock-name{max-width:18%;color:#e4d9f7}
.timer{font:700 17px Georgia,serif;white-space:nowrap;margin-left:auto;flex:0 0 auto;text-align:right;padding-left:8px}
.page{padding:5px 8px 24px;max-width:1600px;margin:auto}
.passage{height:36vh;min-height:180px;max-height:360px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:#fff;border:2px solid #777;box-shadow:0 1px 3px #aaa;padding:10px 12px;font-size:20px;line-height:1.42;white-space:normal;overflow-wrap:anywhere}
#typingInput{display:block;width:100%;height:19vh;min-height:115px;max-height:220px;margin-top:7px;padding:9px 12px;resize:none;border:2px solid #777;box-shadow:0 1px 3px #aaa;background:var(--green);color:#111;font:20px/1.42 Georgia,"Times New Roman",serif;outline:none;border-radius:0}
#typingInput::placeholder{color:#666;opacity:1}
.submit-wrap{text-align:center;padding:10px}.submit{background:#e3e3e3;border:1px solid #555;border-radius:9px;padding:11px 28px;font:700 16px Arial,sans-serif;color:#111;box-shadow:0 1px 1px #aaa}
.result{max-width:600px;margin:20px auto;background:#fff;border:1px solid #aaa;padding:22px;text-align:center;font-family:Arial,sans-serif}.result h2{margin:0 0 15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f1f1f1;padding:13px;border-radius:7px}.stat b{display:block;font-size:23px;margin-bottom:4px}.hidden{display:none!important}
@media(min-width:900px){.page{padding:8px 16px 35px}#typingInput{height:21vh;font-size:22px}}
@media(max-width:600px){.topbar{gap:8px;padding:0 7px;height:50px}.tool{min-width:27px;height:27px;padding:0 4px;font-size:18px}.brand{font-size:14px;margin-left:0;letter-spacing:0}.exam-name,.mock-name{font-size:14px;padding:0 6px;max-width:18%;letter-spacing:0}.mock-name{max-width:17%}.timer{font-size:14px;margin-left:auto;padding-left:4px}.passage{height:36vh;min-height:180px;max-height:360px;font-size:16px;line-height:1.4;padding:10px;overflow-y:auto;overflow-x:hidden}.page{padding:5px 7px}.submit{padding:9px 22px}}
@media(max-width:360px){.topbar{gap:5px}.brand,.exam-name,.mock-name,.timer{font-size:13px}.exam-name,.mock-name{padding:0 4px}}
</style>
</head>
<body>
<header class="topbar">
 <button class="tool" id="increase" aria-label="Increase text size">+</button>
 <button class="tool" id="decrease" aria-label="Decrease text size">−</button>
 <div class="brand">SSC <span>EDGE</span></div>
 <div class="exam-name" id="examName">EXAM</div>
 <div class="mock-name" id="testName">MOCK</div>
 <div class="timer" id="timer">00:00</div>
</header>
<main class="page" id="testPage">
 <div class="passage" id="passage">Loading passage...</div>
 <textarea id="typingInput" placeholder="Start typing here...." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
 <div class="submit-wrap"><button class="submit" id="submit">Submit Test</button></div>
</main>
<section id="result" class="result hidden"></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dvvyoygahzzbnpqrfhen.supabase.co";
const SUPABASE_KEY="sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),mockId=params.get("mock_id");
let mock=null,passageText="",secondsLeft=0,timerHandle=null,finished=false,fontSize=20;
const candidateId=(()=>{let id=localStorage.getItem("ssc_edge_typing_candidate_id");if(!id){id=crypto.randomUUID?crypto.randomUUID():"cand-"+Date.now()+"-"+Math.random().toString(36).slice(2);localStorage.setItem("ssc_edge_typing_candidate_id",id);}return id;})();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function init(){
 if(!mockId){$("passage").textContent="Mock not found. Please go back and select a mock.";return;}
 const {data,error}=await db.from("typing_mocks").select("id,name,duration_minutes,keystrokes,passage_text,exam_id,typing_exams(name)").eq("id",mockId).maybeSingle();
 if(error||!data){$("passage").textContent="Unable to load this typing test.";console.error(error);return;}
 mock=data;passageText=String(data.passage_text||"");
 if(!passageText.trim()){$("passage").textContent="Passage has not been added by admin.";return;}
 $("examName").textContent=data.typing_exams?.name||"EXAM";$("testName").textContent=data.name;
 $("passage").textContent=passageText;
 secondsLeft=Math.max(1,Number(data.duration_minutes)||10)*60;
 updateTimer();timerHandle=setInterval(()=>{secondsLeft--;updateTimer();if(secondsLeft<=0)finishTest(true);},1000);
 $("typingInput").focus();
}
function updateTimer(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;$("timer").textContent="Time Left "+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function getMetrics(){
 const typed=$("typingInput").value,limit=Math.min(typed.length,passageText.length);
 let correct=0;for(let i=0;i<limit;i++)if(typed[i]===passageText[i])correct++;
 const wrong=limit-correct,elapsed=Math.max(1,(Number(mock.duration_minutes)*60)-secondsLeft);
 const accuracy=typed.length?correct/typed.length*100:0;
 const wpm=(correct/5)/(elapsed/60);
 return {typed,correct,wrong,accuracy,wpm,typedCount:typed.length};
}
function paintPassage(){
 // Keep the reference passage clean: no per-character hints or colour feedback.
}
$("typingInput").addEventListener("input",()=>{if(finished)return;if($("typingInput").value.length>=passageText.length)finishTest(false);});
$("submit").addEventListener("click",()=>finishTest(false));
async function finishTest(auto){
 if(finished)return;finished=true;if(timerHandle)clearInterval(timerHandle);$("typingInput").disabled=true;$("submit").disabled=true;
 const m=getMetrics(),elapsed=Math.max(1,(Number(mock.duration_minutes)*60)-secondsLeft);
 const attempt={candidate_id:candidateId,mock_id:mock.id,exam_id:mock.exam_id,typed_text:m.typed,correct_chars:m.correct,incorrect_chars:m.wrong,typed_chars:m.typedCount,accuracy:Number(m.accuracy.toFixed(2)),gross_wpm:Number(m.wpm.toFixed(2)),duration_seconds:elapsed,auto_submitted:auto};
 const {error}=await db.from("typing_attempts").insert(attempt);
 $("testPage").classList.add("hidden");$("result").classList.remove("hidden");
 $("result").innerHTML=`<h2>Typing Test Result</h2><p>${auto?"Time is over.":"Test submitted successfully."}</p>${error?'<p style="color:#b00020">Result could not be saved. Please inform support.</p>':''}<div class="stats">
 <div class="stat"><b>${m.wpm.toFixed(1)}</b>Gross WPM</div>
 <div class="stat"><b>${m.accuracy.toFixed(1)}%</b>Accuracy</div>
 <div class="stat"><b>${m.correct}</b>Correct characters</div>
 <div class="stat"><b>${m.wrong}</b>Incorrect characters</div>
 <div class="stat"><b>${m.typedCount}</b>Typed characters</div>
 <div class="stat"><b>${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")}</b>Time used</div>
 </div><p style="margin-top:18px"><button class="submit" onclick="location.href='typing.html'">Back to Typing</button></p>`;
}
$("increase").addEventListener("click",()=>{fontSize=Math.min(34,fontSize+2);$("passage").style.fontSize=fontSize+"px";$("typingInput").style.fontSize=fontSize+"px";});
$("decrease").addEventListener("click",()=>{fontSize=Math.max(12,fontSize-2);$("passage").style.fontSize=fontSize+"px";$("typingInput").style.fontSize=fontSize+"px";});
init();
</script>
</body>
</html>
