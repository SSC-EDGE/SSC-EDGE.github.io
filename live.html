<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem("ssc-edge-theme")||"dark";</script>
<title>SSC EDGE - Live Tests</title>
<link rel="prefetch" href="test.html">
<link rel="preconnect" href="https://dvvyoygahzzbnpqrfhen.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="live-guard.js"></script>
<style>
:root{--p-bg:#0f0f14;--p-card:#17171f;--p-card2:#20202a;--p-border:#30303c;--p-text:#f7f4fa;--p-muted:#aaa4b3;--p-purple2:#b487ff;--p-header:#21152f;--p-header2:#17111f}
:root[data-theme=light]{--p-bg:#f7f5fa;--p-card:#fff;--p-card2:#f0ebf7;--p-border:#ddd6e8;--p-text:#211d27;--p-muted:#716a7b;--p-purple2:#7834db;--p-header:#eee3ff;--p-header2:#f8f4ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--p-bg)!important;color:var(--p-text)!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:60px}
.simple-header{width:100%;height:62px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(100deg,var(--p-header),var(--p-header2))!important;border-bottom:1px solid var(--p-border)}
.header-brand{font-size:22px;font-weight:900}.header-brand .edge{color:#b487ff}
.page-container{width:100%;max-width:760px;margin:auto;padding:24px 18px 30px}
.practice-back{display:inline-block;margin-bottom:15px;color:var(--p-purple2);font-size:13px;font-weight:800;cursor:pointer}
.page-title{margin:0 0 6px;font-size:27px;line-height:1.15;font-weight:900;display:flex;align-items:center;gap:10px}
.page-subtitle{margin:0 0 25px;font-size:13px;color:var(--p-muted)}
.dot{width:11px;height:11px;border-radius:50%;background:#ef4444;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #ef4444aa}70%{box-shadow:0 0 0 9px #ef444400}100%{box-shadow:0 0 0 0 #ef444400}}
.sec{font-size:12px;font-weight:900;color:var(--p-muted);letter-spacing:.6px;text-transform:uppercase;margin:20px 2px 9px}
.card{border:1px solid #ef444466;background:var(--p-card2);border-radius:14px;padding:15px;margin-bottom:11px}
.card.up{border-color:#f59e0b66}
.badge{display:inline-block;font-size:10px;font-weight:900;border-radius:6px;padding:3px 8px;background:#ef4444;color:#fff;margin-bottom:8px}
.up .badge{background:#f59e0b;color:#111}
.card h3{margin:0 0 5px;font-size:16px}
.meta{font-size:12px;color:var(--p-muted);line-height:1.7}
.btn{display:inline-block;margin-top:11px;padding:11px 18px;border-radius:10px;background:#ef4444;color:#fff;font-weight:800;font-size:12px;text-decoration:none;cursor:pointer}
.btn.off{background:#444;color:#bbb;pointer-events:none}
.empty{text-align:center;color:var(--p-muted);padding:44px 10px;font-size:14px;line-height:1.7}
.note{font-size:11.5px;color:var(--p-muted);margin-top:18px;line-height:1.6;text-align:center}
</style></head><body>
<header class="simple-header"><div class="header-brand">SSC <span class="edge">EDGE</span></div></header>
<main class="page-container">
  <div class="practice-back" onclick="location.href='home.html'">← Back</div>
  <h1 class="page-title"><span class="dot"></span> Live Tests</h1>
  <p class="page-subtitle">All live and upcoming mock tests</p>
  <div id="app"><div class="empty">Loading…</div></div>
  <div class="note">Analysis and solutions open after the live window ends.</div>
</main>
<script>
const db=supabase.createClient("https://dvvyoygahzzbnpqrfhen.supabase.co","sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tests=[],exams=[],done=new Set(),timer=null;
async function load(){
  try{
    await SSCLive.sync(db);
    const iso=new Date(SSCLive.nowMs()).toISOString();
    const [t,e]=await Promise.all([
      db.from("mock_tests").select("id,exam_id,title,duration_minutes,total_questions,is_live,live_start,live_end").eq("is_active",true).eq("is_live",true).gt("live_end",iso).order("live_start"),
      db.from("exams").select("id,name,stage")
    ]);
    if(t.error)throw t.error;
    tests=t.data||[];exams=e.data||[];done=new Set();
    if(tests.length){
      try{
        const u=await db.auth.getUser(),uid=u?.data?.user?.id;
        if(uid){const a=await db.from("test_attempts").select("mock_test_id").eq("user_id",uid).in("mock_test_id",tests.map(x=>x.id)).not("completed_at","is",null);
          (a.data||[]).forEach(x=>done.add(String(x.mock_test_id)))}
      }catch(_){}
    }
    render();
    clearInterval(timer);
    timer=setInterval(()=>{tests.some(x=>SSCLive.state(x)==="ended")?load():render()},30000);
  }catch(err){
    document.getElementById("app").innerHTML='<div class="empty">Could not load live tests.<br>'+esc(err.message)+'</div>';
  }
}
function card(t){
  const st=SSCLive.state(t),now=SSCLive.nowMs(),ex=exams.find(x=>String(x.id)===String(t.exam_id));
  let act;
  if(st==="upcoming")act=`<span class="btn off">Starts in ${SSCLive.left(new Date(t.live_start)-now)}</span>`;
  else if(done.has(String(t.id)))act=`<span class="btn off">Attempted ✓ — results after ${esc(SSCLive.fmt(t.live_end))}</span>`;
  else act=`<a class="btn" href="test.html?id=${encodeURIComponent(t.id)}" onclick="this.textContent='Starting…';this.style.opacity='.7'">START LIVE TEST</a>`;
  return `<div class="card ${st==="upcoming"?"up":""}"><span class="badge">${st==="upcoming"?"UPCOMING":"LIVE NOW"}</span>
    <h3>${esc(t.title||"Live Test")}</h3>
    <div class="meta">${ex?esc(ex.name+(ex.stage?" · "+ex.stage:""))+"<br>":""}⏱ ${t.duration_minutes||0} min · 📝 ${t.total_questions||0} questions<br>
    ${esc(SSCLive.fmt(t.live_start))} → ${esc(SSCLive.fmt(t.live_end))}${st==="live"?"<br>Ends in "+SSCLive.left(new Date(t.live_end)-now):""}</div>${act}</div>`;
}
function render(){
  const live=tests.filter(t=>SSCLive.state(t)==="live"),up=tests.filter(t=>SSCLive.state(t)==="upcoming");
  if(!live.length&&!up.length){
    document.getElementById("app").innerHTML='<div class="empty">🕐 No live tests right now.<br>Check back soon — new live mocks are announced here.</div>';return;
  }
  document.getElementById("app").innerHTML=
    (live.length?'<div class="sec">Live now</div>'+live.map(card).join(""):"")+
    (up.length?'<div class="sec">Upcoming</div>'+up.map(card).join(""):"");
}
load();
</script></body></html>
