<style>
:root{--p-bg:#0f0f14;--p-card:#17171f;--p-card2:#20202a;--p-border:#30303c;--p-text:#f7f4fa;--p-muted:#aaa4b3;--p-purple2:#b487ff;--p-header:#21152f;--p-header2:#17111f}
:root[data-theme=light]{--p-bg:#f7f5fa;--p-card:#fff;--p-card2:#f0ebf7;--p-border:#ddd6e8;--p-text:#211d27;--p-muted:#716a7b;--p-purple2:#7834db;--p-header:#eee3ff;--p-header2:#f8f4ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--p-bg)!important;color:var(--p-text)!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:60px}
.simple-header{width:100%;height:62px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(100deg,var(--p-header),var(--p-header2))!important;border-bottom:1px solid var(--p-border)}
.header-brand{font-size:22px;font-weight:900}.header-brand .edge{color:#b487ff}
.page-container{width:100%;max-width:760px;margin:auto;padding:24px 18px 30px}
.practice-back{display:inline-block;margin-bottom:15px;color:var(--p-purple2);font-size:13px;font-weight:800;cursor:pointer}
.page-title{margin:0 0 6px;font-size:27px;line-height:1.15;font-weight:900;display:flex;align-items:center;gap:10px}
.page-subtitle{margin:0 0 25px;font-size:13px;color:var(--p-muted)}
.sec{font-size:12px;font-weight:900;color:var(--p-muted);letter-spacing:.6px;text-transform:uppercase;margin:20px 2px 9px}
.card{border:1px solid #ef444466;background:var(--p-card2);border-radius:14px;padding:15px;margin-bottom:11px}
.card.up{border-color:#f59e0b66}
.badge{display:inline-block;font-size:10px;font-weight:900;border-radius:6px;padding:3px 8px;background:#ef4444;color:#fff;margin-bottom:8px}
.up .badge{background:#f59e0b;color:#111}
.card h3{margin:0 0 5px;font-size:16px}
.meta{font-size:12px;color:var(--p-muted);line-height:1.7}
.btn{display:inline-block;margin-top:11px;padding:11px 18px;border-radius:10px;background:#ef4444;color:#fff;font-weight:800;font-size:12px;text-decoration:none;cursor:pointer}
.btn.off{background:#444;color:#bbb;pointer-events:none}
.empty{text-align:center;color:var(--p-muted);padding:44px 10px;font-size:14px;line-height:1.7}
.note{font-size:11.5px;color:var(--p-muted);margin-top:18px;line-height:1.6;text-align:center}

/* ===== Back button (mobile + desktop) ===== */
.ssc-back{display:inline-block; margin:0 0 14px; font-size:14px; font-weight:800; color:var(--purple,#8b45ee); text-decoration:none;}
.d-top,.d-foot{display:none;}
@media(min-width:960px){
.d-top{display:block; position:sticky; top:0; z-index:100; width:100%; flex-shrink:0;
  --d-bg:linear-gradient(100deg,#21152f,#17111f); --d-text:#f7f4fa; --d-muted:#aaa4b3; --d-line:#30303c;}
:root[data-theme="light"] .d-top{--d-bg:linear-gradient(100deg,#eee3ff,#f8f4ff); --d-text:#211d27; --d-muted:#716a7b; --d-line:#ddd6e8;}
.d-head{height:96px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; background:var(--d-bg); padding:0 max(32px, calc((100% - max(1200px, 83.333%)) / 2));}
.d-brand{font-size:44px; line-height:1; font-weight:900; color:var(--d-text);}
.d-brand span{color:#9b5cff;}
.d-tag{margin-top:6px; font-size:17px; font-weight:700; line-height:1; color:var(--d-muted);}
.d-nav{height:54px; display:flex; align-items:stretch; gap:28px; background:var(--d-bg); border-bottom:1px solid var(--d-line);
  padding:0 max(16px, calc((100% - max(1200px, 83.333%)) / 2 - 16px));}
.d-nav a{position:relative; display:flex; align-items:center; padding:0 16px; text-decoration:none; color:var(--d-muted);
  font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap;}
.d-nav a::after{content:""; position:absolute; left:16px; right:16px; bottom:0; height:3px; border-radius:3px 3px 0 0;}
.d-nav a.active,.d-nav a:hover{color:#9b5cff;}
.d-nav a.active::after{background:#9b5cff;}
.d-foot{display:block; flex-shrink:0; text-align:center; padding:32px 20px; border-top:1px solid var(--border,var(--p-border,#ddd6e8));}
.d-foot h2{margin:0; font-size:19px; font-weight:800;}
.d-foot h2 span{color:#9b5cff;}
.d-foot p{margin:6px 0 0; font-size:11px; color:var(--muted,var(--p-muted,#716a7b));}
body{display:flex; flex-direction:column; min-height:100vh; padding:0 !important;}
.ssc-back{align-self:flex-start; font-size:15px; margin-bottom:20px;}
}

/* ===== animated hourglass (sand falls while a test is live) ===== */
.hourglass{width:24px; height:32px; flex-shrink:0; overflow:visible; transform-origin:50% 50%;}
.hourglass .cap{fill:#8b45ee;}
.hourglass .glass{fill:rgba(155,92,255,.10); stroke:#9b5cff; stroke-width:1.4;}
.hourglass .sand{fill:#f59e0b;}
.hourglass .stream{stroke:#f59e0b; stroke-width:1.3; stroke-dasharray:1.6 1; opacity:0;}
.hourglass.running{animation:hg-flip 4s ease-in-out infinite;}
.hourglass.running .sand-top{animation:hg-top 4s linear infinite;}
.hourglass.running .sand-bottom{animation:hg-bottom 4s linear infinite;}
.hourglass.running .stream{animation:hg-stream 4s linear infinite, hg-fall .35s linear infinite;}
@keyframes hg-flip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}
@keyframes hg-top{0%{transform:translateY(0)}80%,100%{transform:translateY(8px)}}
@keyframes hg-bottom{0%{transform:translateY(0)}80%{transform:translateY(-8px)}100%{transform:translateY(-12px)}}
@keyframes hg-stream{0%,78%{opacity:1}80%,100%{opacity:0}}
@keyframes hg-fall{to{stroke-dashoffset:-2.6}}
@media(min-width:960px){
.simple-header{display:none;}
.page-container{flex:1 0 auto; max-width:max(1264px, calc(83.333% + 64px)); padding:36px 32px 56px;}
.practice-back{align-self:flex-start; font-size:15px; margin-bottom:20px;}
.page-title{font-size:38px; gap:16px;}
.hourglass{width:33px; height:44px;}
.page-subtitle{font-size:16px; margin-bottom:28px;}
#app{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 22px; align-items:stretch;}
#app > .sec,#app > .empty{grid-column:1/-1;}
.sec{font-size:15px; margin:12px 2px 14px;}
.card{padding:26px; margin-bottom:22px; display:flex; flex-direction:column; align-items:flex-start;}
.badge{font-size:12px; padding:5px 11px; margin-bottom:12px;}
.card h3{font-size:21px; margin-bottom:9px;}
.meta{font-size:14.5px; margin-bottom:7px;}
.btn{font-size:14px; padding:13px 26px; margin-top:auto;}
.empty{font-size:16px; padding:80px 10px;}
.note{font-size:14px; margin-top:24px;}
}

</style></head><body>

  <div class="d-head">

<header class="simple-header"><div class="header-brand">SSC <span class="edge">EDGE</span></div></header>
<main class="page-container">
  <div class="practice-back" onclick="location.href='home.html'">← Back</div>
  <h1 class="page-title"><svg class="hourglass" id="hourglass" viewBox="0 0 24 32" aria-hidden="true">
      <defs>
        <clipPath id="hgTop"><path d="M5 4H19C19 10 14 13 12.8 16H11.2C10 13 5 10 5 4Z"/></clipPath>
        <clipPath id="hgBottom"><path d="M11.2 16H12.8C14 19 19 22 19 28H5C5 22 10 19 11.2 16Z"/></clipPath>
      </defs>
      <path class="glass" d="M5 4H19C19 10 14 13 12.8 16C14 19 19 22 19 28H5C5 22 10 19 11.2 16C10 13 5 10 5 4Z"/>
      <line class="stream" x1="12" y1="15" x2="12" y2="28"/>
      <g clip-path="url(#hgTop)"><rect class="sand sand-top" x="4" y="8" width="16" height="8"/></g>
      <g clip-path="url(#hgBottom)"><rect class="sand sand-bottom" x="4" y="28" width="16" height="8"/></g>
      <rect class="cap" x="2.5" y="1" width="19" height="3.2" rx="1.4"/>
      <rect class="cap" x="2.5" y="27.8" width="19" height="3.2" rx="1.4"/>
    </svg> Live Tests</h1>
  <p class="page-subtitle">All live and upcoming mock tests</p>
  <div id="app"><div class="empty">Loading…</div></div>
  <div class="note">Analysis and solutions open after the live window ends.</div>
</main>
<footer class="d-foot">
  <h2>SSC <span>EDGE</span></h2>
  <p>Learn • Practice • Improve</p>
</footer>

<script>
const db=supabase.createClient("https://dvvyoygahzzbnpqrfhen.supabase.co","sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tests=[],exams=[],done=new Set(),timer=null;
async function load(){
  try{
    await SSCLive.sync(db);
    const iso=new Date(SSCLive.nowMs()).toISOString();
    const [t,e]=await Promise.all([
      db.from("mock_tests").select("id,exam_id,title,duration_minutes,total_questions,is_live,live_start,live_end").eq("is_active",true).eq("is_live",true).gt("live_end",iso).order("live_start"),
      db.from("exams").select("id,name,stage")
    ]);
    if(t.error)throw t.error;
    tests=t.data||[];exams=e.data||[];done=new Set();
    if(tests.length){
      try{
        const u=await db.auth.getUser(),uid=u?.data?.user?.id;
        if(uid){const a=await db.from("test_attempts").select("mock_test_id").eq("user_id",uid).in("mock_test_id",tests.map(x=>x.id)).not("completed_at","is",null);
          (a.data||[]).forEach(x=>done.add(String(x.mock_test_id)))}
      }catch(_){}
    }
    render();
    clearInterval(timer);
    timer=setInterval(()=>{tests.some(x=>SSCLive.state(x)==="ended")?load():render()},30000);
  }catch(err){
    document.getElementById("app").innerHTML='<div class="empty">Could not load live tests.<br>'+esc(err.message)+'</div>';
  }
}
function card(t){
  const st=SSCLive.state(t),now=SSCLive.nowMs(),ex=exams.find(x=>String(x.id)===String(t.exam_id));
  let act;
  if(st==="upcoming")act=`<span class="btn off">Starts in ${SSCLive.left(new Date(t.live_start)-now)}</span>`;
  else if(done.has(String(t.id)))act=`<span class="btn off">Attempted ✓ — results after ${esc(SSCLive.fmt(t.live_end))}</span>`;
  else act=`<a class="btn" href="test.html?id=${encodeURIComponent(t.id)}" onclick="this.textContent='Starting…';this.style.opacity='.7'">START LIVE TEST</a>`;
  return `<div class="card ${st==="upcoming"?"up":""}"><span class="badge">${st==="upcoming"?"UPCOMING":"LIVE NOW"}</span>
    <h3>${esc(t.title||"Live Test")}</h3>
    <div class="meta">${ex?esc(ex.name+(ex.stage?" · "+ex.stage:""))+"<br>":""}⏱ ${t.duration_minutes||0} min · 📝 ${t.total_questions||0} questions<br>
    ${esc(SSCLive.fmt(t.live_start))} → ${esc(SSCLive.fmt(t.live_end))}${st==="live"?"<br>Ends in "+SSCLive.left(new Date(t.live_end)-now):""}</div>${act}</div>`;
}
function render(){
  const live=tests.filter(t=>SSCLive.state(t)==="live"),up=tests.filter(t=>SSCLive.state(t)==="upcoming");
  document.getElementById("hourglass").classList.toggle("running",live.length>0);
  if(!live.length&&!up.length){
    document.getElementById("app").innerHTML='<div class="empty">🕐 No live tests right now.<br>Check back soon — new live mocks are announced here.</div>';return;
  }
  document.getElementById("app").innerHTML=
    (live.length?'<div class="sec">Live now</div>'+live.map(card).join(""):"")+
    (up.length?'<div class="sec">Upcoming</div>'+up.map(card).join(""):"");
}
load();
</script></body></html>
