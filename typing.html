<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Test | SSC EDGE</title>
<link rel="preconnect" href="https://dvvyoygahzzbnpqrfhen.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="css/style.css">
<script src="join-popup.js" defer></script>
<style>
 :root{--bg:#08050e;--card:#171025;--card2:#251344;--purple:#7c3aed;--purple2:#a66bff;--text:#fff;--muted:#aaa2b9;--border:#302044;--surface:#100b19;--modal:#171025;--modal-option:#251b34;--modal-active:#321d51}
:root[data-theme="light"],body[data-theme="light"],body.light-theme,body.light-mode{--bg:#f6f3fb;--card:#fff;--card2:#f1eafa;--purple:#6d35d4;--purple2:#8149e8;--text:#21182d;--muted:#746b80;--border:#e1d7ed;--surface:#fff;--modal:#fff;--modal-option:#f1eafa;--modal-active:#e8dcfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.simple-header{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.header-brand{font-size:19px;font-weight:900;letter-spacing:.4px;white-space:nowrap}.header-brand .edge{color:var(--purple2)}.header-actions{display:flex;align-items:center;gap:9px}.header-btn{border:1px solid var(--border);border-radius:9px;background:var(--card2);color:var(--text);padding:9px 12px;font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}.header-btn.website-btn{background:#a66bff;border-color:#a66bff;color:#fff}
.page-container{max-width:900px;margin:auto;padding:24px 16px 100px}
.page-title{font-size:27px;font-weight:900;margin:8px 0}.page-subtitle{color:var(--muted);margin:7px 0 25px;font-size:14px}
.section-title{font-size:14px;letter-spacing:1px;font-weight:900;margin:22px 0 13px;color:var(--purple2)}
.exam-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.exam-card,.mock-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:15px;padding:17px;cursor:pointer;transition:.15s}
.exam-card:active,.mock-card:active{transform:scale(.99)}
.exam-card h3,.mock-card h3{margin:0;font-size:16px;font-weight:900;color:var(--text)}
.exam-card p{margin:8px 0 0;color:var(--muted);font-size:13px}
.arrow{float:right;color:var(--purple2);font-size:20px}
.back{display:inline-block;color:var(--purple2);font-weight:800;margin:0 0 18px;cursor:pointer}
.mock-list{display:grid;gap:11px}
.mock-card{display:flex;align-items:center;gap:12px;cursor:default}
.mock-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:#3a2060;font-size:21px;flex-shrink:0}
.mock-main{flex:1;min-width:0}.mock-main h3{font-size:14px}.mock-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;color:var(--muted);font-size:12px}
.start-btn{border:1px solid var(--purple);border-radius:9px;background:var(--purple);color:#fff;min-height:36px;padding:0 16px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.start-btn.result-btn{background:transparent;color:var(--purple2)}.start-btn.result-btn:hover{background:rgba(139,92,246,.10)}.mock-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.attempt-info{font-size:11px;font-weight:800;color:var(--purple2);margin-top:8px}@media(max-width:520px){.mock-actions .start-btn{flex:1;min-width:90px}}
.empty{padding:25px;text-align:center;background:var(--card);border:1px dashed var(--border);border-radius:13px;color:var(--muted);font-size:13px}
.hidden{display:none!important}
.mode-modal{position:fixed;inset:0;z-index:200;background:#000b;display:grid;place-items:center;padding:18px}.mode-box{width:min(430px,100%);background:var(--modal);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:22px;position:relative;box-shadow:0 18px 60px #0009}.mode-box h2{margin:0;font-size:21px}.mode-box p{color:var(--muted);font-size:13px;margin:8px 0 18px}.mode-close{position:absolute;right:12px;top:10px;background:transparent;color:var(--text);font-size:25px;padding:3px 8px}.mode-option{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin:10px 0;padding:18px;border-radius:11px;background:var(--modal-option);color:var(--text);border:1px solid var(--border)}.mode-option{font-size:15px;font-weight:800}.mode-option small{font-size:12px;color:#92869f}.mode-option:disabled{opacity:.55;cursor:not-allowed}.mode-option.active{background:var(--modal-active);color:var(--text);border:1px solid var(--purple2);cursor:pointer}.mode-option.active small{color:#d8c2ff}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:99;height:67px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--border)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted)}
.bottom-nav .nav-icon{font-size:20px}.bottom-nav small{font-size:9px;font-weight:800}.bottom-nav a.active small{color:var(--purple2)}
.exam-card{min-height:126px;padding:25px;display:flex;flex-direction:column;justify-content:center}.exam-card h3{font-size:18px}.exam-card p{font-size:14px;margin-top:10px}.mode-option{min-height:58px}@media(min-width:900px){.page-container{max-width:1120px;padding-top:34px}.exam-grid{gap:20px}.exam-card{min-height:170px;padding:32px;border-radius:18px}.exam-card h3{font-size:22px}.exam-card p{font-size:15px}.mock-list{gap:16px}.mock-card{padding:22px;min-height:132px}.mock-main h3{font-size:17px}.mock-meta{font-size:13px}.mock-actions{display:flex;gap:9px;align-items:center;margin-left:auto}.start-btn{padding:12px 18px}}
@media(max-width:480px){.simple-header{padding:0 12px}.header-actions{gap:6px}.header-btn{padding:8px 9px;font-size:11px}.page-container{padding:20px 14px 25px}.page-title{font-size:24px}.exam-grid{gap:10px}.exam-card{padding:24px;min-height:126px}.exam-card h3{font-size:17px}.mock-card{padding:12px}.start-btn{padding:9px 11px}}
</style>
</head>
<body>
<header class="simple-header"><div class="header-brand">SSC <span class="edge">EDGE</span></div><div class="header-actions"><button class="header-btn" id="themeToggle" type="button">☀️ Light</button><a class="header-btn website-btn" href="https://ssc-edge.pages.dev" target="_blank" rel="noopener">Visit Website ↗</a></div></header>
<main class="page-container">
<section id="examScreen">
<h1 class="page-title">TYPING TEST</h1>
<p class="page-subtitle">Choose your exam and practice typing.</p>
<div class="section-title">SELECT EXAM</div>
<div id="examGrid" class="exam-grid"><div class="empty">Loading exams...</div></div>
</section>
<section id="mockScreen" class="hidden">
<div class="back" id="backBtn">‹ Back to exams</div>
<h1 class="page-title" id="examHeading">Typing Mocks</h1>
<p class="page-subtitle">Select a mock test to begin.</p>
<div class="section-title">AVAILABLE MOCKS</div>
<div id="mockList" class="mock-list"></div>
</section>
<div id="modeModal" class="mode-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modeTitle">
 <div class="mode-box"><button type="button" class="mode-close" id="closeMode">×</button><h2 id="modeTitle">Choose Typing Mode</h2><p>Select the typing test format you want to attempt.</p>
  <button type="button" class="mode-option active" id="tcsMode"><span>TCS MODE</span><small>Start typing test →</small></button>
  <button type="button" class="mode-option active" id="eduquityMode"><span>EDUQUITY MODE</span><small>Start typing test →</small></button>
 </div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dvvyoygahzzbnpqrfhen.supabase.co";
const SUPABASE_KEY="sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function syncTypingTheme(){
 const root=document.documentElement,body=document.body;
 let theme=root.getAttribute("data-theme")||body.getAttribute("data-theme");
 if(!theme){const cls=[...root.classList,...body.classList].join(" ");if(/light/i.test(cls))theme="light";else if(/dark/i.test(cls))theme="dark";}
 if(!theme){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),v=localStorage.getItem(k);if(/theme/i.test(k)&&/^(light|dark)$/i.test(v||"")){theme=v.toLowerCase();break;}}}
 if(theme)root.setAttribute("data-theme",theme.toLowerCase());
}
syncTypingTheme();window.addEventListener("storage",syncTypingTheme);
function applyTypingTheme(theme){
 document.documentElement.setAttribute("data-theme",theme);
 document.body.setAttribute("data-theme",theme);
 localStorage.setItem("ssc-edge-theme",theme);
 $("themeToggle").textContent=theme==="light"?"🌙 Dark":"☀️ Light";
}
const savedTypingTheme=localStorage.getItem("ssc-edge-theme");
if(savedTypingTheme==="light"||savedTypingTheme==="dark")applyTypingTheme(savedTypingTheme);
else $("themeToggle").textContent=(document.documentElement.getAttribute("data-theme")==="light")?"🌙 Dark":"☀️ Light";
$("themeToggle").addEventListener("click",()=>applyTypingTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light"));

let selectedExam=null,pendingMockId=null;
const candidateId=(()=>{let id=localStorage.getItem("ssc_edge_typing_candidate_id");if(!id){id=crypto.randomUUID?crypto.randomUUID():"cand-"+Date.now()+"-"+Math.random().toString(36).slice(2);localStorage.setItem("ssc_edge_typing_candidate_id",id);}return id;})();
async function loadExams(){
 const grid=$("examGrid");grid.innerHTML='<div class="empty">Loading exams...</div>';
 const {data,error}=await db.from("typing_exams").select("id,name").eq("is_active",true).order("sort_order").order("created_at");
 if(error){grid.innerHTML='<div class="empty">Unable to load exams. Run the supplied SQL setup first.</div>';console.error(error);return;}
 if(!data.length){grid.innerHTML='<div class="empty">No typing exams available yet.</div>';return;}
 grid.innerHTML=data.map(e=>`<article class="exam-card" data-id="${e.id}"><span class="arrow">›</span><h3>${escapeHtml(e.name)}</h3><p>Typing practice</p></article>`).join("");
 grid.querySelectorAll(".exam-card").forEach(card=>card.addEventListener("click",()=>openExam(data.find(x=>x.id===card.dataset.id))));
}
async function openExam(exam){
 selectedExam=exam;$("examHeading").textContent=exam.name;$("examScreen").classList.add("hidden");$("mockScreen").classList.remove("hidden");
 const list=$("mockList");list.innerHTML='<div class="empty">Loading mocks...</div>';
 const {data,error}=await db.from("typing_mocks").select("id,name,duration_minutes,keystrokes").eq("exam_id",exam.id).eq("is_active",true).order("sort_order").order("created_at");
 if(error){list.innerHTML='<div class="empty">Unable to load mocks.</div>';console.error(error);return;}
 if(!data.length){list.innerHTML='<div class="empty">No mocks added for this exam yet.</div>';return;}
 const attemptMap={},attemptCount={};
 {
  const ids=data.map(m=>m.id);
  const {data:rows,error:attemptError}=await db.from("typing_attempts").select("id,mock_id,created_at").eq("candidate_id",candidateId).in("mock_id",ids).order("created_at",{ascending:false});
  if(!attemptError)(rows||[]).forEach(r=>{if(!attemptMap[r.mock_id])attemptMap[r.mock_id]=r;attemptCount[r.mock_id]=(attemptCount[r.mock_id]||0)+1;});
 }
 list.innerHTML=data.map(m=>{
  const last=attemptMap[m.id];
  return `<article class="mock-card"><div class="mock-icon">⌨️</div><div class="mock-main"><h3>${escapeHtml(m.name)}</h3><div class="mock-meta"><span>⏱ ${Number(m.duration_minutes)||0} min</span><span>⌨ ${Number(m.keystrokes)||0} keystrokes</span></div>${last?`<div class="attempt-info">${attemptCount[m.id]} attempt${attemptCount[m.id]>1?"s":""} completed</div>`:""}<div class="mock-actions">${last?`<button class="start-btn" type="button" data-id="${m.id}">RETAKE</button><button class="start-btn result-btn" type="button" data-id="${m.id}">RESULT</button>`:`<button class="start-btn" type="button" data-id="${m.id}">START</button>`}</div></div></article>`;
 }).join("");
 list.querySelectorAll(".start-btn:not(.result-btn)").forEach(btn=>btn.addEventListener("click",()=>{pendingMockId=btn.dataset.id;$("modeModal").classList.remove("hidden");}));
 list.querySelectorAll(".result-btn").forEach(btn=>btn.addEventListener("click",()=>{location.href="typinganalysis.html?attempt_id="+encodeURIComponent(attemptMap[btn.dataset.id].id)+"&mock_id="+encodeURIComponent(btn.dataset.id);}));

}
$("backBtn").addEventListener("click",()=>{$("mockScreen").classList.add("hidden");$("examScreen").classList.remove("hidden");selectedExam=null;});
 $("closeMode").addEventListener("click",()=>{$("modeModal").classList.add("hidden");pendingMockId=null;});
 $("modeModal").addEventListener("click",e=>{if(e.target.id==="modeModal"){$("modeModal").classList.add("hidden");pendingMockId=null;}});
 $("eduquityMode").addEventListener("click",()=>{if(!pendingMockId)return;location.href="Typingtest.educuity.html?mock_id="+encodeURIComponent(pendingMockId);});
$("tcsMode").addEventListener("click",()=>{if(!pendingMockId)return;location.href="typing.tcs.html?mock_id="+encodeURIComponent(pendingMockId);});
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
loadExams();
</script>
</body>
</html>
