<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Test | SSC EDGE</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--bg:#08050e;--card:#171025;--card2:#251344;--purple:#7c3aed;--purple2:#a66bff;--text:#fff;--muted:#aaa2b9;--border:#302044}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.simple-header{height:64px;display:flex;align-items:center;padding:0 18px;background:#100b19;border-bottom:1px solid var(--border)}
.header-brand{font-size:19px;font-weight:900;letter-spacing:.4px}.header-brand .edge{color:var(--purple2)}
.page-container{max-width:900px;margin:auto;padding:24px 16px 100px}
.page-title{font-size:27px;font-weight:900;margin:8px 0}.page-subtitle{color:var(--muted);margin:7px 0 25px;font-size:14px}
.section-title{font-size:14px;letter-spacing:1px;font-weight:900;margin:22px 0 13px;color:var(--purple2)}
.exam-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.exam-card,.mock-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:15px;padding:17px;cursor:pointer;transition:.15s}
.exam-card:active,.mock-card:active{transform:scale(.99)}
.exam-card h3,.mock-card h3{margin:0;font-size:16px;font-weight:900}
.exam-card p{margin:8px 0 0;color:var(--muted);font-size:12px}
.arrow{float:right;color:var(--purple2);font-size:20px}
.back{display:inline-block;color:var(--purple2);font-weight:800;margin:0 0 18px;cursor:pointer}
.mock-list{display:grid;gap:11px}
.mock-card{display:flex;align-items:center;gap:12px;cursor:default}
.mock-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:#3a2060;font-size:21px;flex-shrink:0}
.mock-main{flex:1;min-width:0}.mock-main h3{font-size:14px}.mock-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;color:var(--muted);font-size:12px}
.start-btn{border:0;border-radius:9px;background:var(--purple);color:#fff;padding:10px 14px;font-weight:900;white-space:nowrap}
.empty{padding:25px;text-align:center;background:var(--card);border:1px dashed var(--border);border-radius:13px;color:var(--muted);font-size:13px}
.hidden{display:none!important}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:99;height:67px;display:grid;grid-template-columns:repeat(4,1fr);background:#100b19;border-top:1px solid var(--border)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted)}
.bottom-nav .nav-icon{font-size:20px}.bottom-nav small{font-size:9px;font-weight:800}.bottom-nav a.active small{color:var(--purple2)}
@media(max-width:480px){.page-container{padding:20px 14px 95px}.page-title{font-size:24px}.exam-grid{gap:10px}.exam-card{padding:14px}.exam-card h3{font-size:14px}.mock-card{padding:12px}.start-btn{padding:9px 11px}}
</style>
</head>
<body>
<header class="simple-header"><div class="header-brand">SSC <span class="edge">EDGE</span></div></header>
<main class="page-container">
<section id="examScreen">
<h1 class="page-title">TYPING TEST</h1>
<p class="page-subtitle">Choose your exam and practice typing.</p>
<div class="section-title">SELECT EXAM</div>
<div id="examGrid" class="exam-grid"><div class="empty">Loading exams...</div></div>
</section>
<section id="mockScreen" class="hidden">
<div class="back" id="backBtn">‹ Back to exams</div>
<h1 class="page-title" id="examHeading">Typing Mocks</h1>
<p class="page-subtitle">Select a mock test to begin.</p>
<div class="section-title">AVAILABLE MOCKS</div>
<div id="mockList" class="mock-list"></div>
</section>
</main>
<nav class="bottom-nav">
<a href="home.html"><span class="nav-icon">🏠</span><small>Home</small></a>
<a href="study.html"><span class="nav-icon">📚</span><small>Study Material</small></a>
<a href="practice.html" class="active"><span class="nav-icon">📝</span><small>Practice</small></a>
<a href="profile.html"><span class="nav-icon">👤</span><small>Profile</small></a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dvvyoygahzzbnpqrfhen.supabase.co";
const SUPABASE_KEY="sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let selectedExam=null;
async function loadExams(){
 const grid=$("examGrid");grid.innerHTML='<div class="empty">Loading exams...</div>';
 const {data,error}=await db.from("typing_exams").select("*").eq("is_active",true).order("sort_order").order("created_at");
 if(error){grid.innerHTML='<div class="empty">Unable to load exams. Run the supplied SQL setup first.</div>';console.error(error);return;}
 if(!data.length){grid.innerHTML='<div class="empty">No typing exams available yet.</div>';return;}
 grid.innerHTML=data.map(e=>`<article class="exam-card" data-id="${e.id}"><span class="arrow">›</span><h3>${escapeHtml(e.name)}</h3><p>Typing practice</p></article>`).join("");
 grid.querySelectorAll(".exam-card").forEach(card=>card.addEventListener("click",()=>openExam(data.find(x=>x.id===card.dataset.id))));
}
async function openExam(exam){
 selectedExam=exam;$("examHeading").textContent=exam.name;$("examScreen").classList.add("hidden");$("mockScreen").classList.remove("hidden");
 const list=$("mockList");list.innerHTML='<div class="empty">Loading mocks...</div>';
 const {data,error}=await db.from("typing_mocks").select("*").eq("exam_id",exam.id).eq("is_active",true).order("sort_order").order("created_at");
 if(error){list.innerHTML='<div class="empty">Unable to load mocks.</div>';console.error(error);return;}
 if(!data.length){list.innerHTML='<div class="empty">No mocks added for this exam yet.</div>';return;}
 list.innerHTML=data.map(m=>`<article class="mock-card"><div class="mock-icon">⌨️</div><div class="mock-main"><h3>${escapeHtml(m.name)}</h3><div class="mock-meta"><span>⏱ ${Number(m.duration_minutes)||0} min</span><span>⌨ ${Number(m.keystrokes)||0} keystrokes</span></div></div><button class="start-btn" type="button" data-id="${m.id}">Start</button></article>`).join("");
 // Typing engine is intentionally not part of this phase.
 list.querySelectorAll(".start-btn").forEach(btn=>btn.addEventListener("click",()=>alert("Typing test engine will be added in the next phase.")));
}
$("backBtn").addEventListener("click",()=>{$("mockScreen").classList.add("hidden");$("examScreen").classList.remove("hidden");selectedExam=null;});
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
loadExams();
</script>
</body>
</html>
